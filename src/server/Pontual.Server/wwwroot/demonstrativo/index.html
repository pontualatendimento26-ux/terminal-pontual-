:hover { background: var(--azul-900); box-shadow: 0 6px 16px rgba(13, 71, 161, 0.25); }\r\n.btn:active { transform: scale(0.97); }\r\n.btn.claro { background: var(--branco); color: var(--tinta); border-color: var(--linha-forte); }\r\n.btn.claro:hover { background: var(--fundo); border-color: var(--apagado); box-shadow: none; }\r\n.btn.verde { background: var(--verde-500); } .btn.verde:hover { background: var(--verde-700); box-shadow: 0 6px 16px rgba(46, 158, 91, 0.25); }\r\n.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }\r\n.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--branco); font-size: 13px; font-weight: 600; }\r\n.avatar.g { width: 48px; height: 48px; font-size: 16px; } .avatar.gg { width: 56px; height: 56px; font-size: 18px; border-radius: 16px; }\r\n.avatar.logo-marca { background: var(--branco); border: 1px solid var(--linha); overflow: hidden; padding: 3px; }\r\n.avatar.logo-marca img { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; border-radius: 6px; }\r\n.avatar.q { border-radius: 12px; } .avatar.m { width: 28px; height: 28px; font-size: 11px; }\r\n.guias { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); }\r\n.guias button { min-height: 44px; padding: 0 14px; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--suave); font-weight: 500; transition: color var(--t), border-color var(--t); }\r\n.guias button:hover { color: var(--tinta); }\r\n.guias button[aria-selected=\"true\"] { color: var(--azul-700); border-bottom-color: var(--azul-700); }\r\n.vazio { padding: 40px 16px; text-align: center; color: var(--suave); }\r\n\r\n/* ----------------------------------------------------------------- topo */\r\n.topo { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linha); }\r\n.topo > div { display: flex; align-items: center; gap: 24px; min-height: 72px; }\r\n/* O arquivo da logo é quadrado, com muita margem; a moldura corta a margem. */\r\n.logo { display: inline-flex; align-items: center; justify-content: center; width: 168px; height: 44px; overflow: hidden; flex: none; }\r\n.logo img { width: 184px; height: 184px; flex: none; }\r\n.logo-texto { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--azul-700); } .logo-texto em { font-style: normal; color: var(--verde-500); }\r\n.topo .fim { margin-left: auto; display: flex; align-items: center; gap: 16px; }\r\n.topo .topo-btn { min-height: 44px; padding: 0 16px; font-size: 14px; }\r\n.ligado { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--verde-700); }\r\n.ligado::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--verde-400); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18); }\r\n.ligado.sem { color: var(--rubi-700); font-weight: 500; }\r\n.ligado.sem::before { background: var(--rubi-700); box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.16); }\r\n.ligado.espera { color: var(--suave); }\r\n.ligado.espera::before { background: var(--apagado); box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.2); }\r\n.hora { font-size: 13px; color: var(--suave); text-align: right; line-height: 1.3; } .hora b { display: block; font-size: 17px; font-weight: 600; color: var(--tinta); }\r\n.eu { display: flex; align-items: center; gap: 10px; } .eu b { display: block; color: var(--tinta); font-weight: 600; font-size: 14px; line-height: 1.3; } .eu small { color: var(--suave); font-size: 12px; }\r\n\r\n/* ------------------------------------------------------------ atendente */\r\n.app { min-height: 100vh; display: flex; flex-direction: column; background: var(--branco); position: relative; }\r\n.heroi { padding: 72px 0 40px; text-align: center; background: radial-gradient(900px 320px at 50% -80px, var(--azul-50), transparent 70%); }\r\n.heroi h1 { font-size: clamp(34px, 4.4vw, 52px); letter-spacing: -0.035em; font-weight: 600; }\r\n.heroi h1 span { background: var(--marca); -webkit-background-clip: text; background-clip: text; color: transparent; }\r\n.heroi > div > p { margin-top: 10px; font-size: 17px; color: var(--suave); }\r\n.procura { position: relative; width: min(640px, 100%); margin: 32px auto 0; }\r\n.procura input { width: 100%; height: 64px; padding: 0 76px 0 58px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--branco); font-size: 18px; color: var(--tinta); box-shadow: var(--s-2); transition: border-color var(--t), box-shadow var(--t); }\r\n.procura input::placeholder { color: var(--apagado); }\r\n.procura input:focus { outline: none; border-color: var(--azul-500); box-shadow: 0 0 0 5px rgba(25, 118, 210, 0.14), var(--s-2); }\r\n.procura input::-webkit-search-cancel-button { display: none; }\r\n.procura > svg { position: absolute; left: 22px; top: 21px; color: var(--azul-700); }\r\n.procura kbd { position: absolute; right: 20px; top: 19px; height: 26px; padding: 0 10px; border-radius: 8px; background: #eef1f5; color: var(--suave); font: 500 12px 'Poppins', sans-serif; display: grid; place-items: center; }\r\n.bloco { padding: 20px 0; }\r\n.bloco > h2 { font-size: 15px; font-weight: 600; color: var(--suave); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }\r\n.abertos { display: flex; gap: 10px; flex-wrap: wrap; }\r\n.aberto { display: inline-flex; align-items: center; height: 48px; border-radius: 999px; border: 1px solid var(--azul-100); background: var(--azul-50); transition: border-color var(--t), box-shadow var(--t); }\r\n.aberto:hover { border-color: var(--azul-500); box-shadow: var(--s-1); }\r\n.aberto button { border: none; background: none; height: 100%; display: inline-flex; align-items: center; gap: 10px; padding: 0 6px 0 8px; color: var(--azul-900); font-weight: 500; border-radius: 999px; }\r\n.aberto .x { padding: 0 14px 0 6px; color: var(--apagado); } .aberto .x:hover { color: var(--rubi-700); }\r\n.destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }\r\n.destaque { display: grid; gap: 18px; justify-items: start; text-align: left; padding: 22px; border-radius: var(--r-lg); border: 1px solid var(--linha); background: var(--branco); transition: transform var(--t), box-shadow var(--t), border-color var(--t); }\r\n.destaque:hover { transform: translateY(-4px); box-shadow: var(--s-2); border-color: transparent; }\r\n.destaque:active { transform: scale(0.98); }\r\n.destaque b { display: block; color: var(--tinta); font-weight: 600; font-size: 16px; line-height: 1.25; }\r\n.destaque small { color: var(--suave); font-size: 13px; }\r\n.todos-topo { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }\r\n.todos-topo h2 { font-size: 22px; letter-spacing: -0.01em; }\r\n.lista-sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 32px; margin-top: 8px; }\r\n.item { display: grid; grid-template-columns: 40px 1fr 20px; gap: 14px; align-items: center; text-align: left; padding: 12px 10px; margin: 0 -10px; border: none; border-bottom: 1px solid var(--linha); background: none; border-radius: var(--r-sm); transition: background-color var(--t); }\r\n.item:hover { background: var(--fundo); }\r\n.item > span { min-width: 0; }\r\n.item b { display: block; color: var(--tinta); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.item small { display: block; color: var(--apagado); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.item > svg { color: var(--linha-forte); transition: color var(--t), transform var(--t); } .item:hover > svg { color: var(--azul-500); transform: translateX(3px); }\r\n.rodape { margin-top: auto; border-top: 1px solid var(--linha); background: var(--fundo); }\r\n.rodape > div { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; min-height: 76px; padding: 14px 0; font-size: 13px; color: var(--suave); }\r\n.rodape .elo { border: none; background: none; padding: 0; min-height: 44px; color: var(--azul-700); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }\r\n.rodape .fim { margin-left: auto; text-align: right; }\r\n\r\n/* Carregando, aguardando aprovação e cadastro inválido: mesmo desenho da tela de manutenção, dentro da página. */\r\n.estado { flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 24px; background: radial-gradient(900px 320px at 50% -80px, var(--azul-50), transparent 70%); }\r\n.estado i { width: 96px; height: 96px; border-radius: 28px; background: var(--azul-50); color: var(--azul-700); display: grid; place-items: center; margin: 0 auto 24px; }\r\n.estado i.ambar { background: var(--ambar-100); color: var(--ambar-700); }\r\n.estado i.rubi { background: var(--rubi-100); color: var(--rubi-700); }\r\n.estado h1 { font-size: 36px; letter-spacing: -0.02em; margin-bottom: 10px; }\r\n.estado p { max-width: 46ch; margin: 0 auto; font-size: 17px; color: var(--suave); }\r\n.estado p strong { color: var(--tinta); font-weight: 600; }\r\n.girando svg { animation: gira 1.1s linear infinite; }\r\n@keyframes gira { to { transform: rotate(360deg); } }\r\n\r\n.manut { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; padding: 32px; background: var(--branco); }\r\n.manut:focus { outline: none; }\r\n.manut i { width: 96px; height: 96px; border-radius: 28px; background: var(--azul-50); color: var(--azul-700); display: grid; place-items: center; margin: 0 auto 24px; }\r\n.manut h2 { font-size: 36px; letter-spacing: -0.02em; margin-bottom: 10px; } .manut p { max-width: 44ch; margin: 0 auto; font-size: 17px; color: var(--suave); }\r\n.veu { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 20px; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(3px); animation: surge 160ms ease-out; }\r\n.folha { width: min(520px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--branco); border-radius: var(--r-xl); padding: 32px; box-shadow: var(--s-3); animation: sobe 220ms ease-out; }\r\n.folha h2 { font-size: 24px; letter-spacing: -0.01em; margin-bottom: 8px; }\r\n.folha h3 { font-size: 13px; color: var(--suave); margin: 18px 0 6px; font-weight: 500; }\r\n.folha ul { margin: 0; padding-left: 18px; }\r\n.acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }\r\n.folha.larga { width: min(720px, 100%); }\r\n.folha.calc { width: min(400px, 100%); }\r\n.calc-visor { background: var(--fundo); border: 1px solid var(--linha); border-radius: var(--r-md); padding: 14px 16px; text-align: right; margin-top: 10px; }\r\n.calc-ultima { font-size: 13px; color: var(--apagado); min-height: 18px; }\r\n.calc-expr { font-size: 18px; color: var(--suave); min-height: 26px; word-break: break-all; }\r\n.calc-res { font-size: 34px; font-weight: 600; color: var(--tinta); min-height: 42px; word-break: break-all; }\r\n.calc-res.erro { font-size: 18px; color: var(--rubi-700); line-height: 42px; }\r\n.calc-teclas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }\r\n.calc-teclas button { font: inherit; font-size: 20px; font-weight: 500; padding: 14px 0; border-radius: var(--r-md); border: 1px solid var(--linha); background: var(--branco); color: var(--tinta); cursor: pointer; transition: background-color var(--t), transform var(--t); }\r\n.calc-teclas button:hover { background: var(--fundo); } .calc-teclas button:active { transform: scale(0.96); }\r\n.calc-teclas .op { background: var(--fundo); color: var(--azul-500); }\r\n.calc-teclas .igual { background: var(--azul-500); border-color: var(--azul-500); color: #fff; } .calc-teclas .igual:hover { filter: brightness(1.08); background: var(--azul-500); }\r\n.calc-teclas .apaga { color: var(--rubi-700); }\r\n.calc-dica { font-size: 12.5px; color: var(--apagado); margin-top: 12px; }\r\n/* Calculadora em janela própria do Windows (?calc=1): ocupa a janela toda e as teclas crescem com ela. */\r\nbody.modo-calc { overflow: hidden; }\r\n.calc-janela { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 12px; background: var(--branco); }\r\n.calc-janela .calc-visor { margin-top: 0; flex: 0 0 auto; }\r\n.calc-janela .calc-res { font-size: clamp(26px, 9vw, 42px); min-height: 1.2em; }\r\n.calc-janela .calc-res.erro { font-size: 18px; line-height: 1.2em; }\r\n.calc-janela .calc-teclas { flex: 1 1 auto; min-height: 0; grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }\r\n.calc-janela .calc-teclas button { padding: 0; height: 100%; min-height: 0; font-size: clamp(16px, 5.5vw, 26px); }\r\n.folha .explica { color: var(--suave); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }\r\n.folha .procura-apps { width: 100%; padding: 10px 12px; border: 1px solid var(--linha); border-radius: var(--r-sm); background: var(--fundo); color: var(--tinta); font: inherit; font-size: 15px; margin-bottom: 6px; }\r\n.folha .procura-apps:focus { outline: 2px solid var(--azul-500); outline-offset: 1px; }\r\n.folha .lista-sites { grid-template-columns: 1fr; margin-top: 0; }\r\n.folha .item[disabled] { opacity: 0.55; cursor: not-allowed; } .folha .item[disabled]:hover { background: none; }\r\n.folha .item[disabled] > svg { color: var(--apagado); transform: none; }\r\n@keyframes surge { from { opacity: 0; } } @keyframes sobe { from { opacity: 0; transform: translateY(10px); } } @keyframes desliza { from { transform: translateX(32px); opacity: 0; } }\r\n\r\n.avisos { position: fixed; right: 20px; top: 92px; z-index: 70; display: grid; gap: 10px; width: min(360px, calc(100vw - 40px)); }\r\n.toast { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 16px; border-radius: var(--r-md); background: var(--branco); border: 1px solid var(--linha); box-shadow: var(--s-3); color: var(--tinta); font-size: 14px; animation: desliza 240ms ease-out; }\r\n.toast svg { color: var(--verde-500); margin-top: 1px; }\r\n.toast.urgente { border-color: #f5b5b5; border-left: 5px solid var(--rubi-700); } .toast.urgente svg { color: var(--rubi-700); }\r\n\r\n@media (max-width: 900px) {\r\n  .topo > div { flex-wrap: wrap; padding: 10px 0; }\r\n  .hora { display: none; }\r\n  .heroi { padding: 44px 0 24px; }\r\n}\r\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\r\n\u003c/style>\n\u003cstyle>/* Assistente Pontual: a janela de conversa que abre no botão flutuante do Terminal.\n   Usa as cores e a fonte de app.css. */\nhtml, body.as { height: 100%; }\nbody.as { display: flex; flex-direction: column; background: var(--fundo); overflow: hidden; font-size: 14.5px; }\n\n.as-topo { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; background: var(--marca); color: var(--branco); flex: none; }\n.as-marca { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.18); flex: none; }\n.as-titulo { flex: 1; min-width: 0; }\n.as-titulo h1 { color: var(--branco); font-size: 15.5px; font-weight: 600; }\n.as-titulo p { font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.as-icone { width: 36px; height: 36px; border: none; border-radius: 50%; background: transparent; color: var(--branco); display: grid; place-items: center; flex: none; transition: background-color var(--t); }\n.as-icone:hover { background: rgba(255, 255, 255, 0.2); }\n.as-icone:focus-visible { outline-color: var(--branco); outline-offset: 0; border-radius: 50%; }\n\n.as-corpo { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 14px 8px; scrollbar-width: thin; }\n.as-estado { height: 100%; display: grid; place-items: center; text-align: center; color: var(--suave); padding: 0 24px; }\n.as-estado h2 { font-size: 17px; margin-bottom: 6px; }\n.as-falas { display: flex; flex-direction: column; gap: 10px; }\n\n.as-fala { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }\n.as-fala.eu { align-self: flex-end; background: var(--azul-700); color: var(--branco); border-bottom-right-radius: 6px; }\n.as-fala.ia { align-self: flex-start; background: var(--branco); color: var(--tinta); border: 1px solid var(--linha); border-bottom-left-radius: 6px; box-shadow: var(--s-1); }\n.as-fala.ia strong { font-weight: 600; }\n.as-fala.falha { background: var(--rubi-100); border-color: transparent; color: var(--rubi-700); }\n.as-divisa { align-self: center; margin: 8px 0 2px; font-size: 12px; color: var(--apagado); }\n\n/* Avaliação da resposta: discreta, logo abaixo do balão da assistente. */\n.as-avaliar { align-self: flex-start; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -4px 0 2px 4px; max-width: 88%; font-size: 12px; color: var(--apagado); }\n.as-avaliar button { border: 1px solid var(--linha-forte); border-radius: 999px; background: var(--branco); color: var(--suave); font: inherit; padding: 3px 11px; transition: border-color var(--t), color var(--t), background-color var(--t); }\n.as-avaliar button:hover { border-color: var(--azul-500); color: var(--azul-700); }\n.as-avaliar button.forte { background: var(--azul-700); border-color: var(--azul-700); color: var(--branco); }\n.as-avaliar button:disabled { opacity: 0.55; cursor: not-allowed; }\n.as-avaliar textarea { flex: 1 1 100%; min-width: 240px; border: 1px solid var(--linha-forte); border-radius: 12px; background: var(--branco); color: var(--tinta); font: inherit; font-size: 13px; padding: 8px 10px; resize: vertical; outline: none; }\n.as-avaliar textarea:focus { border-color: var(--azul-500); }\n.as-avaliar-linha { display: flex; gap: 6px; }\n.as-consulta { margin-left: 8px; font-size: 12.5px; color: var(--apagado); }\n\n/* Tela e WhatsApp: o interruptor acima do campo e a nota sob a pergunta que levou a tela. */\n.as-tela { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 6px 4px; padding: 3px 11px 3px 9px; border: 1px solid var(--linha-forte); border-radius: 999px; background: var(--branco); color: var(--suave); font: inherit; font-size: 12px; transition: border-color var(--t), color var(--t); }\n.as-tela::before { content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--apagado); }\n.as-tela[aria-checked=\"true\"] { border-color: var(--azul-500); color: var(--azul-700); }\n.as-tela[aria-checked=\"true\"]::before { background: var(--verde-400, #10b981); }\n.as-viu { align-self: flex-end; margin: -6px 4px 0 0; font-size: 11.5px; color: var(--apagado); }\n\n.as-pontos { display: inline-flex; gap: 5px; padding: 4px 0; }\n.as-pontos i { width: 7px; height: 7px; border-radius: 50%; background: var(--apagado); animation: as-pulo 1.1s ease-in-out infinite; }\n.as-pontos i:nth-child(2) { animation-delay: 0.15s; } .as-pontos i:nth-child(3) { animation-delay: 0.3s; }\n@keyframes as-pulo { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }\n@media (prefers-reduced-motion: reduce) { .as-pontos i { animation: none; } }\n\n.as-envio { flex: none; padding: 8px 12px 10px; background: var(--branco); border-top: 1px solid var(--linha); }\n.as-caixa { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px; border: 1px solid var(--linha-forte); border-radius: 22px; background: var(--branco); transition: border-color var(--t), box-shadow var(--t); }\n.as-caixa:focus-within { border-color: var(--azul-500); box-shadow: 0 0 0 4px rgba(25, 118, 210, 0.16); }\n.as-caixa textarea { flex: 1; min-width: 0; border: none; outline: none; resize: none; background: transparent; font: inherit; color: var(--tinta); line-height: 1.45; padding: 6px 0; max-height: 120px; }\n.as-caixa textarea::placeholder { color: var(--apagado); }\n.as-caixa button { width: 36px; height: 36px; border: none; border-radius: 50%; background: var(--azul-700); color: var(--branco); display: grid; place-items: center; flex: none; transition: background-color var(--t), transform var(--t); }\n.as-caixa button:hover { background: var(--azul-900); } .as-caixa button:active { transform: scale(0.94); }\n.as-caixa button:disabled { background: var(--linha-forte); cursor: not-allowed; transform: none; }\n.as-nota { margin-top: 6px; font-size: 11.5px; color: var(--apagado); text-align: center; }\n.as-erro { margin: 0 4px 6px; font-size: 13px; font-weight: 500; color: var(--rubi-700); }\n.as-acao { align-self: flex-start; margin: -6px 0 0 4px; }\n.as-acao.falha { color: var(--rubi-700); }\n\n/* Consulta de CPF no Nexus: o painel com os setores e o resultado do roteiro. */\n.as-nexus { display: flex; flex-direction: column; gap: 8px; white-space: normal; min-width: min(340px, 88%); }\n.as-nx-nome { font-size: 13px; color: var(--suave); margin-top: -4px; }\n.as-nx-aviso { font-size: 12.5px; font-weight: 500; color: var(--ambar-700); background: var(--ambar-100); border-radius: var(--r-sm); padding: 6px 10px; }\n.as-nx-pergunta { font-size: 13px; color: var(--texto); }\n.as-nx-botoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }\n.as-nx-setor { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border: 1px solid var(--linha-forte); border-radius: var(--r-sm); background: var(--branco); color: var(--tinta); font: inherit; text-align: left; transition: border-color var(--t), background-color var(--t); }\n.as-nx-setor b { font-size: 13.5px; font-weight: 600; }\n.as-nx-setor small { font-size: 11.5px; color: var(--suave); line-height: 1.3; }\n.as-nx-setor.paga small { color: var(--ambar-700); }\n.as-nx-setor:hover:not(:disabled) { border-color: var(--azul-500); background: var(--azul-50); }\n.as-nx-setor.sugerido { border: 2px solid var(--azul-500); background: var(--azul-50); padding: 7px 9px; }\n.as-nx-setor.feito::after { content: \"consultado\"; font-size: 11px; color: var(--verde-700); font-weight: 500; }\n.as-nx-setor:disabled { opacity: 0.55; cursor: not-allowed; }\n.as-nx-nota { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--texto); }\n.as-nx-nota.falha { color: var(--rubi-700); font-weight: 500; }\n.as-nx-nota button { border: 1px solid var(--linha-forte); border-radius: 999px; background: var(--branco); color: var(--suave); font: inherit; font-size: 12.5px; padding: 4px 12px; }\n.as-nx-nota button.forte { background: var(--azul-700); border-color: var(--azul-700); color: var(--branco); }\n.as-nx-resultado { max-width: 94%; font-size: 13.5px; }\n\n/* Botões fixos de consulta no Nexus, acima do campo. */\n.as-setores { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 4px 8px; font-size: 12px; color: var(--suave); }\n.as-setores span { margin-right: 2px; }\n.as-setores button { border: 1px solid var(--linha-forte); border-radius: 999px; background: var(--branco); color: var(--azul-700); font: inherit; font-weight: 600; padding: 4px 14px; transition: border-color var(--t), background-color var(--t), color var(--t); }\n.as-setores button:hover:not(:disabled) { border-color: var(--azul-500); background: var(--azul-50); }\n.as-setores button[aria-pressed=\"true\"] { background: var(--azul-700); border-color: var(--azul-700); color: var(--branco); }\n.as-setores button:disabled { opacity: 0.55; cursor: not-allowed; }\n\n/* Tabela do resultado da consulta no Nexus. */\n.as-tabela { margin: 6px 0; overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--r-sm); white-space: normal; }\n.as-tabela table { width: 100%; border-collapse: collapse; font-size: 12.5px; line-height: 1.35; }\n.as-tabela th { position: sticky; top: 0; background: var(--azul-50); color: var(--azul-900); font-weight: 600; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linha-forte); white-space: nowrap; }\n.as-tabela td { padding: 5px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }\n.as-tabela tr:last-child td { border-bottom: none; }\n.as-tabela td:first-child { font-weight: 600; white-space: nowrap; }\n.as-tabela td.ok { color: var(--verde-700); font-weight: 600; white-space: nowrap; }\n.as-tabela td.nao { color: var(--rubi-700); white-space: nowrap; }\n.as-tabela td.atencao { color: var(--ambar-700); font-weight: 600; white-space: nowrap; }\n.as-tabela td.conferir { color: var(--azul-700); font-weight: 600; white-space: nowrap; }\n.as-tabela tr.apagada td { color: var(--suave); }\n.as-tabela tr.apagada td.nao { color: var(--rubi-700); }\n.as-tabela td:nth-child(3) { white-space: nowrap; }\n.as-nx-resultado { max-width: 100%; width: 100%; }\n.as-detalhes { margin-top: 6px; }\n.as-detalhes summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--azul-700); }\n.as-detalhes > div { margin-top: 6px; font-size: 12.5px; color: var(--texto); }\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"as\">\n\n\u003cheader class=\"as-topo\">\n  \u003cspan class=\"as-marca\" aria-hidden=\"true\">\n    \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3Z\"/>\u003cpath d=\"M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z\"/>\u003c/svg>\n  \u003c/span>\n  \u003cdiv class=\"as-titulo\">\u003ch1>Assistente Pontual\u003c/h1>\u003cp id=\"as-sub\">Roteiros operacionais dos bancos\u003c/p>\u003c/div>\n  \u003cbutton type=\"button\" class=\"as-icone\" id=\"as-nova\" title=\"Começar uma conversa nova\" aria-label=\"Começar uma conversa nova\">\n    \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>\n  \u003c/button>\n  \u003cbutton type=\"button\" class=\"as-icone\" id=\"as-fechar\" title=\"Fechar\" aria-label=\"Fechar a assistente\">\n    \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M6 6l12 12M18 6 6 18\"/>\u003c/svg>\n  \u003c/button>\n\u003c/header>\n\n\u003cmain class=\"as-corpo\" id=\"as-corpo\" aria-live=\"polite\">\n  \u003cdiv class=\"as-estado\" id=\"as-estado\">\u003cp id=\"as-estado-texto\">Carregando a conversa…\u003c/p>\u003c/div>\n  \u003cdiv class=\"as-falas\" id=\"as-falas\" hidden>\u003c/div>\n\u003c/main>\n\n\u003cform class=\"as-envio\" id=\"as-form\" novalidate>\n  \u003cp class=\"as-erro\" id=\"as-erro\" role=\"alert\" hidden>\u003c/p>\n  \u003cbutton type=\"button\" class=\"as-tela\" id=\"as-tela\" role=\"switch\" aria-checked=\"true\" hidden>\u003c/button>\n  \u003cdiv class=\"as-setores\" id=\"as-setores\" role=\"group\" aria-label=\"Consultar CPF no Nexus\">\n    \u003cspan>Consultar CPF no Nexus:\u003c/span>\n    \u003cbutton type=\"button\" data-setor=\"siape\" aria-pressed=\"false\">SIAPE\u003c/button>\n    \u003cbutton type=\"button\" data-setor=\"inss\" aria-pressed=\"false\">INSS\u003c/button>\n    \u003cbutton type=\"button\" data-setor=\"exercito\" aria-pressed=\"false\">Exército\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"as-caixa\">\n    \u003ctextarea id=\"as-texto\" rows=\"1\" maxlength=\"4000\" placeholder=\"Pergunte sobre um banco ou mande o CPF do cliente\" aria-label=\"Sua pergunta\" disabled>\u003c/textarea>\n    \u003cbutton type=\"submit\" id=\"as-enviar\" aria-label=\"Enviar a pergunta\" disabled>\n      \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\"/>\u003c/svg>\n    \u003c/button>\n  \u003c/div>\n\u003c/form>\n\n\u003cscript>// Assistente Pontual — a conversa da atendente com a IA.\n// JavaScript puro. Fala só com o servidor da Pontual (/api/v1/device/assistant); a chave da IA fica lá.\n// Nada que vem do servidor ou da IA entra na página como HTML: sempre textContent.\n'use strict';\n\n(() => {\n  const P = window.PONTUAL || {};\n  const ponte = P.hosted && window.chrome && window.chrome.webview ? window.chrome.webview : null;\n  const $ = (id) => document.getElementById(id);\n  const falas = $('as-falas'), corpo = $('as-corpo'), campo = $('as-texto'), botao = $('as-enviar');\n\n  let ligada = false;       // o servidor confirmou que a assistente vale para esta máquina\n  let ocupada = false;      // há uma resposta chegando\n  let novaConversa = false; // a próxima pergunta abre uma conversa nova\n  let ultimaConversa = null;\n  let atendente = '';\n  const avaliadas = new Map(); // id da resposta → true (ajudou) ou false (não ajudou)\n\n  // A assistente pode ver o que está na tela (a aba em uso e a conversa do WhatsApp) na hora da pergunta.\n  // Precisa de três coisas: o programa do Terminal saber entregar a tela (P.screen), a Central permitir\n  // (o servidor diz ao carregar) e a atendente não ter desligado o interruptor acima do campo.\n  const CHAVE_TELA = 'pontual.assistente.tela';\n  const sabeVerTela = Boolean(ponte && P.screen);\n  let telaPermitida = false;\n  let aprendeComWhatsApp = false; // a Central registra as conversas do WhatsApp para a análise\n  let telaLigada = true;\n  try { telaLigada = sessionStorage.getItem(CHAVE_TELA) !== '0'; } catch { /* sem armazenamento: começa ligada */ }\n  const pedidosDeTela = new Map();\n  let numeroDoPedido = 0;\n\n  function pintarTela() {\n    const pode = sabeVerTela && telaPermitida && ligada, botao = $('as-tela');\n    botao.hidden = !pode;\n    botao.setAttribute('aria-checked', String(telaLigada));\n    botao.textContent = telaLigada ? 'Vendo a sua tela e o WhatsApp' : 'Sem ver a sua tela';\n    botao.title = telaLigada ? 'Clique para a assistente não ver a tela nas próximas perguntas.' : 'Clique para a assistente ver a tela e o WhatsApp quando você perguntar.';\n  }\n  $('as-tela').onclick = () => {\n    telaLigada = !telaLigada;\n    try { sessionStorage.setItem(CHAVE_TELA, telaLigada ? '1' : '0'); } catch { /* vale só até fechar */ }\n    pintarTela();\n    campo.focus();\n  };\n\n  // Pede ao programa do Terminal a tela (se permitida) e a lista do que ele pode abrir. Se ele não\n  // responder a tempo, a pergunta segue sem isso.\n  const sabeAbrir = Boolean(ponte && P.actions);\n  function pedirTela() {\n    const querTela = sabeVerTela && telaPermitida && telaLigada;\n    if (!querTela && !sabeAbrir) return Promise.resolve({ screen: null, apps: null });\n    return new Promise((resolver) => {\n      const id = String(++numeroDoPedido);\n      const prazo = setTimeout(() => { pedidosDeTela.delete(id); resolver({ screen: null, apps: null }); }, 8000);\n      pedidosDeTela.set(id, (m) => { clearTimeout(prazo); resolver(m); });\n      ponte.postMessage({ type: 'assistant-context', id, screen: querTela });\n    });\n  }\n  const pedidosDeAcao = new Map();\n  if (ponte) {\n    ponte.addEventListener('message', (e) => {\n      const m = e.data;\n      if (m && m.type === 'assistant-action-result' && pedidosDeAcao.has(m.id)) {\n        const nota = pedidosDeAcao.get(m.id); pedidosDeAcao.delete(m.id);\n        nota.textContent = typeof m.message === 'string' ? m.message : (m.ok ? 'Pronto.' : 'Não consegui abrir.');\n        nota.classList.toggle('falha', !m.ok);\n        return;\n      }\n      if (!m || m.type !== 'assistant-context-result' || !pedidosDeTela.has(m.id)) return;\n      const entregar = pedidosDeTela.get(m.id);\n      pedidosDeTela.delete(m.id);\n      entregar({\n        screen: m.screen && typeof m.screen === 'object' ? m.screen : null,\n        apps: Array.isArray(m.apps) ? m.apps : null,\n      });\n    });\n  }\n\n  // A IA pede para abrir algo escrevendo, na última linha, [[abrir: Nome]] ou [[pesquisar: texto]].\n  // Essa linha não aparece na conversa; vai para o Terminal, que só abre o que está liberado nele.\n  const ACAO = /\\[\\[\\s*(abrir|pesquisar)\\s*:\\s*([^\\]\\n]{1,200})\\]\\]/i;\n  function semAcao(texto) {\n    return String(texto).replace(/\\[\\[\\s*(abrir|pesquisar)\\s*:[^\\]\\n]*\\]\\]/gi, '').replace(/\\[\\[[^\\]\\n]*$/, '').trimEnd();\n  }\n  function executar(resposta, texto) {\n    const achada = sabeAbrir ? ACAO.exec(texto) : null;\n    if (!achada) return;\n    const id = String(++numeroDoPedido);\n    const nota = el('div', 'as-viu as-acao', achada[1].toLowerCase() === 'abrir' ? `Abrindo ${achada[2].trim()}…` : `Pesquisando no Google: ${achada[2].trim()}…`);\n    resposta.after(nota);\n    pedidosDeAcao.set(id, nota);\n    setTimeout(() => { if (pedidosDeAcao.delete(id)) { nota.textContent = 'O Terminal não respondeu.'; nota.classList.add('falha'); } }, 10000);\n    ponte.postMessage({ type: 'assistant-action', id, action: achada[1].toLowerCase() === 'abrir' ? 'open' : 'search', value: achada[2].trim() });\n  }\n  function notaDaTela(alvo, contexto) {\n    if (contexto) alvo.after(el('div', 'as-viu', `Com a tela: ${contexto}`));\n  }\n\n  // --------------------------------------------------------------- desenho\n  function el(tag, classe, texto) {\n    const n = document.createElement(tag);\n    if (classe) n.className = classe;\n    if (texto !== undefined) n.textContent = texto;\n    return n;\n  }\n  // Só **negrito** é interpretado; o resto aparece como veio (as quebras de linha valem pelo CSS).\n  // Linhas seguidas que começam com \"|\" viram uma tabela (o resultado da consulta no Nexus, ou uma tabela da IA).\n  // Depois de \"[[detalhes]]\" o texto fica fechado em \"Ver detalhes\" (a consulta no Nexus mostra só o essencial).\n  function formatar(alvo, texto) {\n    const corte = String(texto).indexOf('[[detalhes]]');\n    if (corte >= 0) {\n      formatarParte(alvo, String(texto).slice(0, corte).trimEnd());\n      const caixa = el('details', 'as-detalhes'), resumo = el('summary', '', 'Ver detalhes'), dentro = el('div');\n      formatarParte(dentro, String(texto).slice(corte + '[[detalhes]]'.length).trim());\n      caixa.append(resumo, dentro);\n      alvo.append(caixa);\n      return;\n    }\n    formatarParte(alvo, texto);\n  }\n  function formatarParte(alvo, texto) {\n    alvo.replaceChildren();\n    const linhas = semAcao(texto).replace(/^#{1,6}\\s+/gm, '').split('\\n');\n    let corrido = [], tabela = [];\n    const negrito = (destino, t) => t.split(/\\*\\*([^*\\n]+)\\*\\*/).forEach((parte, i) => { if (parte) destino.append(i % 2 ? el('strong', '', parte) : parte); });\n    const soltarTexto = () => { if (corrido.length) { negrito(alvo, corrido.join('\\n')); corrido = []; } };\n    const soltarTabela = () => {\n      if (!tabela.length) return;\n      const celulas = (l) => l.trim().replace(/^\\|/, '').replace(/\\|$/, '').split('|').map((c) => c.trim());\n      const linhasT = tabela.filter((l) => !/^\\s*\\|[\\s:|-]+\\|\\s*$/.test(l)).map(celulas);\n      tabela = [];\n      if (!linhasT.length) return;\n      const caixa = el('div', 'as-tabela'), t = el('table');\n      const cab = el('tr'); linhasT[0].forEach((c) => cab.append(el('th', '', c)));\n      const thead = el('thead'); thead.append(cab); t.append(thead);\n      const corpoT = el('tbody');\n      for (const linha of linhasT.slice(1)) {\n        const tr = el('tr');\n        linha.forEach((c) => {\n          const td = el('td');\n          negrito(td, c);\n          if (/^✅/.test(c)) td.className = 'ok'; else if (/^❌/.test(c)) td.className = 'nao'; else if (/^⚠/.test(c)) td.className = 'atencao'; else if (/^🔎/.test(c)) td.className = 'conferir';\n          tr.append(td);\n        });\n        if (/^❌/.test(linha.find((c) => /^[✅❌⚠🔎]/.test(c)) || '')) tr.className = 'apagada';\n        corpoT.append(tr);\n      }\n      t.append(corpoT); caixa.append(t);\n      if (alvo.lastChild && typeof alvo.lastChild.textContent === 'string' && alvo.lastChild.nodeType === 3) alvo.lastChild.textContent = alvo.lastChild.textContent.replace(/\\n+$/, '');\n      alvo.append(caixa);\n      corrido.push('');\n    };\n    for (const l of linhas) {\n      if (/^\\s*\\|.*\\|\\s*$/.test(l)) { soltarTexto(); tabela.push(l); } else { soltarTabela(); corrido.push(l); }\n    }\n    soltarTabela(); soltarTexto();\n  }\n  function noFim() { return corpo.scrollHeight - corpo.scrollTop - corpo.clientHeight \u003c 80; }\n  function descer() { corpo.scrollTop = corpo.scrollHeight; }\n  function estado(titulo, texto) {\n    const caixa = $('as-estado');\n    caixa.replaceChildren(el('div'));\n    if (titulo) caixa.firstChild.append(el('h2', '', titulo));\n    caixa.firstChild.append(el('p', '', texto));\n    caixa.hidden = false; falas.hidden = true;\n  }\n  function mostrarFalas() { $('as-estado').hidden = true; falas.hidden = false; }\n  function divisa(texto) { falas.append(el('div', 'as-divisa', texto)); }\n  function fala(papel, texto, id, contexto) {\n    const n = el('div', `as-fala ${papel === 'user' ? 'eu' : 'ia'}`);\n    if (papel === 'user') n.textContent = texto; else formatar(n, texto);\n    falas.append(n);\n    if (papel === 'user') notaDaTela(n, contexto);\n    if (papel !== 'user' && id) falas.append(avaliacao(id));\n    return n;\n  }\n\n  // Abaixo de cada resposta: \"Ajudou\" ou \"Não ajudou\". A correção escrita vai para a supervisão revisar;\n  // a assistente só passa a usá-la depois de aprovada.\n  function avaliacao(id) {\n    const barra = el('div', 'as-avaliar');\n    const botao = (rotulo, classe) => { const b = el('button', classe || '', rotulo); b.type = 'button'; return b; };\n    const pintar = () => {\n      barra.replaceChildren();\n      if (avaliadas.has(id)) { barra.append(el('span', '', avaliadas.get(id) ? 'Você marcou: ajudou' : 'Você marcou: não ajudou. A supervisão vai revisar.')); return; }\n      const sim = botao('Ajudou'), nao = botao('Não ajudou');\n      sim.onclick = () => enviarAvaliacao(id, true, '', pintar, [sim, nao]);\n      nao.onclick = corrigir;\n      barra.append(sim, nao);\n    };\n    function corrigir() {\n      const texto = el('textarea');\n      texto.rows = 2; texto.maxLength = 2000;\n      texto.placeholder = 'O que está errado, ou qual é o certo? (opcional)';\n      texto.setAttribute('aria-label', 'O que está errado na resposta, ou qual é o certo');\n      const enviar = botao('Enviar', 'forte'), voltar = botao('Cancelar');\n      enviar.onclick = () => enviarAvaliacao(id, false, texto.value.trim(), pintar, [enviar, voltar]);\n      voltar.onclick = pintar;\n      const linha = el('div', 'as-avaliar-linha'); linha.append(enviar, voltar);\n      barra.replaceChildren(texto, linha);\n      texto.focus();\n    }\n    pintar();\n    return barra;\n  }\n  async function enviarAvaliacao(id, ajudou, texto, pintar, botoes) {\n    botoes.forEach((b) => { b.disabled = true; });\n    try {\n      const r = await fetch('/api/v1/device/assistant/feedback', { method: 'POST', headers: cabecalhos(true), body: JSON.stringify({ messageId: id, helpful: ajudou, text: texto }) });\n      if (!r.ok) throw new Error(await mensagemDeErro(r));\n      avaliadas.set(id, ajudou);\n      erro('');\n      pintar();\n    } catch (e) {\n      botoes.forEach((b) => { b.disabled = false; });\n      erro(e instanceof TypeError ? 'Sem conexão com o servidor. A avaliação não foi enviada.' : e.message);\n    }\n  }\n  function dia(iso) {\n    const d = new Date(iso);\n    if (Number.isNaN(d.getTime())) return 'Conversa anterior';\n    const hoje = new Date();\n    const mesmo = d.toDateString() === hoje.toDateString();\n    const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });\n    return mesmo ? `Hoje, ${hora}` : `${d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}, ${hora}`;\n  }\n  function erro(mensagem) { $('as-erro').textContent = mensagem || ''; $('as-erro').hidden = !mensagem; }\n  function liberar() {\n    campo.disabled = !ligada;\n    document.querySelectorAll('#as-setores button').forEach((b) => { b.disabled = !ligada || ocupada; });\n    botao.disabled = !ligada || ocupada || !campo.value.trim();\n  }\n  function vazio() {\n    const nome = atendente.trim().split(/\\s+/)[0];\n    estado(nome ? `Olá, ${nome}` : 'Olá', 'Pergunte como fazer uma operação, as regras de um banco ou o que fazer quando algo dá errado. Eu respondo com base nos roteiros da Pontual. Para saber em qual banco um cliente passa, mande o CPF dele.');\n  }\n\n  // ------------------------------------------------------------------- API\n  const cabecalhos = (json) => ({ Authorization: `Bearer ${P.token}`, ...(json ? { 'Content-Type': 'application/json' } : {}) });\n  async function mensagemDeErro(resposta) {\n    try { const dados = await resposta.json(); if (dados && typeof dados.error === 'string') return dados.error; } catch { /* sem corpo JSON */ }\n    return resposta.status === 429 ? 'Muitas perguntas em pouco tempo. Aguarde um minuto.' : `O servidor respondeu com o erro ${resposta.status}.`;\n  }\n\n  async function carregar() {\n    if (!P.token) { estado('Assistente indisponível', 'Abra a assistente pelo Terminal Pontual.'); return; }\n    let dados;\n    try {\n      const r = await fetch('/api/v1/device/assistant', { headers: cabecalhos(false), cache: 'no-store' });\n      if (!r.ok) throw new Error(await mensagemDeErro(r));\n      dados = await r.json();\n    } catch (e) {\n      ligada = false; liberar(); pintarTela();\n      estado('Sem conexão', e instanceof TypeError ? 'Não foi possível falar com o servidor da Pontual. Tente de novo em instantes.' : e.message);\n      return;\n    }\n    ligada = dados.enabled === true;\n    atendente = typeof dados.attendantName === 'string' ? dados.attendantName : '';\n    telaPermitida = dados.screen === true;\n    aprendeComWhatsApp = dados.whatsappLearning === true;\n    liberar(); pintarTela();\n    if (!ligada) { estado('Assistente desligada', 'A assistente não está ligada para este computador. Fale com o TI.'); return; }\n\n    falas.replaceChildren();\n    ultimaConversa = null;\n    const lista = Array.isArray(dados.messages) ? dados.messages : [];\n    avaliadas.clear();\n    for (const f of Array.isArray(dados.feedback) ? dados.feedback : []) avaliadas.set(f.messageId, f.helpful === true);\n    for (const m of lista) {\n      if (m.conversationId !== ultimaConversa) { divisa(dia(m.at)); ultimaConversa = m.conversationId; }\n      fala(m.role, m.text, m.id, m.context);\n    }\n    if (lista.length) { mostrarFalas(); descer(); } else vazio();\n    campo.focus();\n  }\n\n  async function enviar(texto) {\n    ocupada = true; erro(''); liberar();\n    mostrarFalas();\n    if (novaConversa || ultimaConversa === null) divisa(dia(new Date().toISOString()));\n    const pergunta = fala('user', texto);\n    const resposta = el('div', 'as-fala ia');\n    const pontos = el('span', 'as-pontos'); pontos.append(el('i'), el('i'), el('i'));\n    // Quando a base é grande, a assistente consulta os roteiros antes de responder e diz qual está lendo.\n    const consultando = el('span', 'as-consulta');\n    resposta.append(pontos, consultando);\n    falas.append(resposta);\n    descer();\n\n    let recebido = '', falhou = null, respostaId = null;\n    try {\n      // A tela é lida agora, no momento da pergunta, e vai só com ela.\n      const { screen: tela, apps } = await pedirTela();\n      const r = await fetch('/api/v1/device/assistant/messages', {\n        method: 'POST', headers: cabecalhos(true), body: JSON.stringify({ text: texto, newConversation: novaConversa, ...(tela ? { screen: tela } : {}), ...(apps ? { apps } : {}) }),\n      });\n      if (!r.ok) throw new Error(await mensagemDeErro(r));\n      novaConversa = false;\n\n      const leitor = r.body.getReader(), decodificador = new TextDecoder();\n      let resto = '';\n      for (;;) {\n        const { value, done } = await leitor.read();\n        if (done) break;\n        resto += decodificador.decode(value, { stream: true });\n        let corte;\n        while ((corte = resto.indexOf('\\n\\n')) >= 0) {\n          const linha = resto.slice(0, corte); resto = resto.slice(corte + 2);\n          if (!linha.startsWith('data: ')) continue;\n          let evento; try { evento = JSON.parse(linha.slice(6)); } catch { continue; }\n          if (evento.conversationId) { ultimaConversa = evento.conversationId; if (typeof evento.screen === 'string') notaDaTela(pergunta, evento.screen); }\n          if (typeof evento.status === 'string' && !recebido) consultando.textContent = evento.status;\n          if (evento.done === true && evento.id) respostaId = evento.id;\n          if (typeof evento.delta === 'string') {\n            const colado = noFim();\n            recebido += evento.delta;\n            formatar(resposta, recebido);\n            if (colado) descer();\n          }\n          if (typeof evento.error === 'string') falhou = evento.error;\n        }\n      }\n      if (!recebido && !falhou) falhou = 'A assistente não respondeu. Tente de novo.';\n    } catch (e) {\n      falhou = e instanceof TypeError ? 'A conexão com o servidor caiu. Tente de novo.' : e.message;\n    }\n\n    if (falhou) {\n      if (recebido) { erro(falhou); } else { resposta.classList.add('falha'); resposta.textContent = falhou; }\n    }\n    if (respostaId && recebido) { const colado = noFim(); resposta.after(avaliacao(respostaId)); if (colado) descer(); }\n    if (recebido && !falhou) executar(resposta, recebido);\n    ocupada = false; liberar();\n    campo.focus();\n  }\n\n  // ------------------------------------------------------ consulta de CPF no Nexus\n  // A atendente manda o CPF: em vez de ir para a IA, aparecem os botões SIAPE, INSS e Exército, um já sugerido.\n  // No clique, a Central consulta o Nexus; consulta paga só depois de confirmar. O resultado vira uma fala da\n  // assistente (texto montado pela Central a partir do roteiro do Nexus), e a IA o lê nas próximas perguntas.\n  const CPF = /(?\u003c!\\d)(\\d{3}\\.?\\d{3}\\.?\\d{3}[-.\\s]?\\d{2})(?!\\d)/;\n  function cpfValido(texto) {\n    const achado = CPF.exec(texto);\n    if (!achado) return null;\n    const d = achado[1].replace(/\\D/g, '');\n    if (d.length !== 11 || /^(\\d)\\1{10}$/.test(d)) return null;\n    for (let t = 9; t \u003c= 10; t++) {\n      let soma = 0;\n      for (let i = 0; i \u003c t; i++) soma += Number(d[i]) * (t + 1 - i);\n      if ((soma * 10) % 11 % 10 !== Number(d[t])) return null;\n    }\n    return d;\n  }\n  const esperar = (ms) => new Promise((r) => { setTimeout(r, ms); });\n  let nexusDesligado = false; // a Central não tem o Nexus configurado: o CPF vai para a IA como antes\n\n  async function chamar(metodo, url, corpo) {\n    const r = await fetch(url, { method: metodo, headers: cabecalhos(Boolean(corpo)), cache: 'no-store', ...(corpo ? { body: JSON.stringify(corpo) } : {}) });\n    if (!r.ok) throw new Error(await mensagemDeErro(r));\n    return r.json();\n  }\n\n  async function consultarCpf(texto, cpf, setor) {\n    ocupada = true; erro(''); liberar();\n    let dados = null, falha = null;\n    try {\n      dados = await chamar('GET', `/api/v1/device/nexus/localizar?cpf=${cpf}&dica=${encodeURIComponent(texto.slice(0, 300))}`);\n    } catch (e) {\n      falha = e instanceof TypeError ? 'Sem conexão com o servidor. Tente de novo.' : e.message;\n    }\n    ocupada = false; liberar();\n    if (dados && dados.configured !== true) {\n      if (setor) { erro('A consulta no Nexus ainda não foi ligada na Central. Avise o TI.'); return; }\n      nexusDesligado = true; enviar(texto); return;\n    }\n\n    mostrarFalas();\n    if (novaConversa || ultimaConversa === null) divisa(dia(new Date().toISOString()));\n    fala('user', texto);\n    const painel = el('div', 'as-fala ia as-nexus');\n    falas.append(painel);\n    if (falha) { painel.classList.add('falha'); painel.textContent = falha; }\n    else desenharPainel(painel, dados, cpf, setor);\n    descer();\n    campo.focus();\n  }\n\n  function desenharPainel(painel, dados, cpf, setorPedido) {\n    const partes = [el('strong', '', `Consultar no Nexus: CPF ${dados.cpf}`)];\n    if (dados.nome) partes.push(el('div', 'as-nx-nome', dados.nome));\n    if (dados.naEsteira) partes.push(el('div', 'as-nx-aviso', 'Este CPF já tem contrato em andamento na esteira.'));\n    if (dados.aviso) partes.push(el('div', 'as-nx-aviso', dados.aviso));\n    partes.push(el('div', 'as-nx-pergunta', dados.sugestao ? 'Em qual setor consultar? Já deixei sugerido:' : 'Em qual setor consultar?'));\n    const botoes = el('div', 'as-nx-botoes');\n    const nota = el('div', 'as-nx-nota');\n    nota.hidden = true;\n    const lista = Array.isArray(dados.setores) ? dados.setores : [];\n    for (const s of lista) {\n      const b = el('button', `as-nx-setor${s.setor === dados.sugestao ? ' sugerido' : ''}${s.custo === 'paga' ? ' paga' : ''}`);\n      b.type = 'button';\n      b.dataset.setor = s.setor;\n      const detalhe = s.estado === 'fora' ? `fora do ar${s.motivo ? `: ${s.motivo}` : ''}` : `${s.nota}${s.estado === 'lento' ? ' · lento agora' : ''}`;\n      b.append(el('b', '', s.setor === dados.sugestao ? `${s.nome} (sugerido)` : s.nome), el('small', '', detalhe));\n      b.disabled = s.estado === 'fora';\n      b.onclick = () => (s.custo === 'paga' ? confirmar(s) : rodar(s, false));\n      botoes.append(b);\n    }\n    partes.push(botoes, nota);\n    painel.replaceChildren(...partes);\n    // A atendente já escolheu o setor no botão de baixo: a consulta sai direto (a paga ainda pede confirmação).\n    const pedido = setorPedido ? botoes.querySelector(`[data-setor=\"${setorPedido}\"]`) : null;\n    if (pedido && !pedido.disabled) setTimeout(() => pedido.click(), 0);\n\n    const travar = (sim) => botoes.querySelectorAll('button').forEach((b) => {\n      const s = lista.find((x) => x.setor === b.dataset.setor);\n      b.disabled = sim || !s || s.estado === 'fora';\n    });\n    const botaoNota = (rotulo, classe) => { const b = el('button', classe || '', rotulo); b.type = 'button'; return b; };\n\n    function confirmar(s, aviso) {\n      nota.hidden = false; nota.className = 'as-nx-nota';\n      const sim = botaoNota('Confirmar consulta paga', 'forte'), nao = botaoNota('Voltar');\n      sim.onclick = () => rodar(s, true);\n      nao.onclick = () => { nota.hidden = true; };\n      const linha = el('div', 'as-avaliar-linha'); linha.append(sim, nao);\n      nota.replaceChildren(el('span', '', aviso || `A consulta no ${s.nome} é paga: ainda não há resultado guardado deste CPF. Confirmar?`), linha);\n      const colado = noFim(); if (colado) descer();\n    }\n\n    async function rodar(s, paga) {\n      travar(true);\n      nota.hidden = false; nota.className = 'as-nx-nota';\n      const pontos = el('span', 'as-pontos'); pontos.append(el('i'), el('i'), el('i'));\n      const texto = el('span', 'as-consulta', `Consultando ${s.nome} no Nexus…`);\n      nota.replaceChildren(pontos, texto);\n      descer();\n      try {\n        let r = await chamar('POST', '/api/v1/device/nexus/consultas', { cpf, setor: s.setor, allowPaid: paga, newConversation: novaConversa });\n        if (r.status === 'precisa_autorizar') { travar(false); confirmar(s, r.mensagem); return; }\n        novaConversa = false;\n        const limite = Date.now() + 4 * 60 * 1000;\n        while (r.status === 'em_andamento') {\n          if (Date.now() > limite) throw new Error('A consulta demorou demais no Nexus. Tente de novo em instantes.');\n          texto.textContent = `Consultando ${s.nome} no Nexus… previsão de uns ${r.previsaoSegundos || 30} s`;\n          await esperar(4000);\n          r = await chamar('GET', `/api/v1/device/nexus/consultas/${r.id}`);\n        }\n        if (r.status === 'erro') throw new Error(r.mensagem || 'A consulta no Nexus falhou.');\n        nota.hidden = true; travar(false);\n        botoes.querySelector(`[data-setor=\"${s.setor}\"]`)?.classList.add('feito');\n        if (r.conversationId) ultimaConversa = r.conversationId;\n        if (r.resposta && typeof r.resposta.text === 'string') {\n          const n = fala('assistant', r.resposta.text, r.resposta.id);\n          n.classList.add('as-nx-resultado');\n          n.scrollIntoView({ block: 'start', behavior: 'smooth' });\n        } else if (r.mensagem) {\n          nota.hidden = false; nota.textContent = r.mensagem;\n        }\n      } catch (e) {\n        travar(false);\n        nota.hidden = false; nota.className = 'as-nx-nota falha';\n        nota.textContent = e instanceof TypeError ? 'A conexão com o servidor caiu. Tente de novo.' : e.message;\n      }\n    }\n  }\n\n  // --------------------------------------------------------------- eventos\n  // Botões fixos SIAPE / INSS / Exército acima do campo. Com um CPF já digitado, consulta na hora; sem CPF,\n  // o setor fica marcado e a próxima mensagem com CPF vai para ele.\n  const NOMES_SETOR = { siape: 'SIAPE', inss: 'INSS', exercito: 'Exército' };\n  const TEXTO_DO_CAMPO = campo.placeholder;\n  let setorEscolhido = null;\n  function escolherSetor(setor) {\n    setorEscolhido = setor;\n    document.querySelectorAll('#as-setores button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setor === setor)));\n    campo.placeholder = setor ? `Digite o CPF do cliente para consultar no ${NOMES_SETOR[setor]}` : TEXTO_DO_CAMPO;\n  }\n  document.querySelectorAll('#as-setores button').forEach((b) => {\n    b.onclick = () => {\n      if (ocupada || !ligada) return;\n      const texto = campo.value.trim(), cpf = cpfValido(texto);\n      if (cpf) { campo.value = ''; ajustarAltura(); escolherSetor(null); erro(''); consultarCpf(texto, cpf, b.dataset.setor); return; }\n      escolherSetor(setorEscolhido === b.dataset.setor ? null : b.dataset.setor);\n      campo.focus();\n    };\n  });\n  function ajustarAltura() { campo.style.height = 'auto'; campo.style.height = `${Math.min(campo.scrollHeight, 120)}px`; }\n  campo.addEventListener('input', () => { ajustarAltura(); liberar(); });\n  campo.addEventListener('keydown', (e) => {\n    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('as-form').requestSubmit(); }\n  });\n  $('as-form').addEventListener('submit', (e) => {\n    e.preventDefault();\n    const texto = campo.value.trim();\n    if (!texto || ocupada || !ligada) return;\n    campo.value = ''; ajustarAltura();\n    const cpf = cpfValido(texto);\n    if (setorEscolhido) {\n      if (!cpf) { campo.value = texto; ajustarAltura(); erro(`Digite um CPF válido para consultar no ${NOMES_SETOR[setorEscolhido]}.`); return; }\n      const setor = setorEscolhido; escolherSetor(null);\n      consultarCpf(texto, cpf, setor);\n      return;\n    }\n    if (cpf && !nexusDesligado) consultarCpf(texto, cpf); else enviar(texto);\n  });\n  $('as-nova').onclick = () => {\n    if (ocupada || !ligada) return;\n    novaConversa = true; erro('');\n    if (!falas.hidden && falas.lastChild && !falas.lastChild.classList.contains('as-divisa')) { divisa('Nova conversa'); descer(); }\n    campo.focus();\n  };\n  const fechar = () => { if (ponte) ponte.postMessage({ type: 'assistant-close' }); };\n  $('as-fechar').onclick = fechar;\n  if (!ponte) $('as-fechar').hidden = true;\n  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fechar(); });\n\n  // O programa avisa quando a janela é aberta de novo: a conversa é recarregada se nada estiver em andamento.\n  if (ponte) {\n    ponte.addEventListener('message', (e) => {\n      if (e.data && e.data.type === 'assistant-shown' && !ocupada) { if (ligada) campo.focus(); else carregar(); }\n    });\n  } function quadro(nome, html, extra = {}) {
  const f = el('iframe', { title: nome });
  const cfg = { nome, online, config: D.config, mapa: D.mapa, logos: D.logos, ...extra };
  // O shim entra antes de tudo e faz o papel do programa Terminal e da Central.
  f.srcdoc = html.replace('<head>', () => '<head><script>window.__DEMO=' + JSON.stringify(cfg).replace(/</g, '\\u003c') + ';(' + shim.toString() + ')()<\/script>');
  return f;
}
function shim() {
  const C = window.__DEMO, ouvintes = [];
  const ponte = { postMessage: (m) => parent.postMessage({ demo: C.nome, m }, '*'), addEventListener: (t, f) => ouvintes.push(f) };
  window.chrome = window.chrome || {};
  try { Object.defineProperty(window.chrome, 'webview', { value: ponte, configurable: true }); } catch { window.chrome = { webview: ponte }; }
  window.PONTUAL = { hosted: true, token: 'demonstracao', hostname: 'PC-DEMONSTRACAO', locked: true, apps: true, calc: true, pdf: true, actions: true, screen: false };
  window.__LOGOS = C.logos;
  addEventListener('message', (e) => {
    if (e.source !== parent || !e.data || !e.data.ao) return;
    if (typeof e.data.online === 'boolean') C.online = e.data.online;
    ouvintes.forEach((f) => f({ data: e.data.ao }));
  });
  const json = (o) => new Response(JSON.stringify(o), { headers: { 'Content-Type': 'application/json' } });
  const pausa = (ms) => new Promise((r) => setTimeout(r, ms));
  let n = 0;
  const resposta = (t) => {
    const q = t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const abrir = /\b(?:abr[aeir]+|abre)\s+(?:o |a |os )?(.+?)[.!?]*$/.exec(q);
    if (abrir) {
      const item = C.config.items.find((i) => i.name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().includes(abrir[1].trim()));
      return item ? `Certo, vou abrir o ${item.name}.\n[[abrir: ${item.name}]]` : `"${abrir[1]}" não está na lista liberada deste Terminal.`;
    }
    if (/document/.test(q)) return 'Resposta de exemplo. Documentos normalmente pedidos:\n\n- **Documento com foto** (RG ou CNH)\n- **Comprovante de residência** recente\n- **Contracheque ou extrato** do benefício\n\nNo Terminal real, a resposta segue o roteiro do banco escolhido.';
    if (/portabil/.test(q)) return 'Resposta de exemplo. Na **portabilidade**:\n\n1. Peça o saldo devedor do contrato\n2. Confira as regras do banco de destino\n3. Digite a proposta e acompanhe a esteira\n\nNo Terminal real, eu consulto o roteiro do banco antes de responder.';
    return 'Esta é uma **resposta de exemplo** da demonstração: a inteligência artificial não está ligada aqui. No Terminal real, eu respondo com base nos roteiros da Pontual.\n\nTente: "documentos necessários", "como funciona a portabilidade", "abra o WhatsApp" ou o CPF de teste 529.982.247-25.';
  };
  const SET = { siape: 'SIAPE', inss: 'INSS', exercito: 'Exército' };
  window.fetch = async (url, op = {}) => {
    const u = String(url), corpo = op.body ? JSON.parse(op.body) : {};
    if (u.startsWith('logos/mapa')) return json(C.mapa);
    if (!C.online) throw new TypeError('sem conexão');
    if (u.endsWith('/device/config')) return json(C.config);
    if (u.endsWith('/device/assistant')) return json({ enabled: true, attendantName: C.config.attendantName, messages: [], feedback: [], screen: false });
    if (u.endsWith('/feedback')) { ponte.postMessage({ type: 'demo', feito: 'avaliar' }); return json({}); }
    if (u.includes('/nexus/localizar')) {
      const cpf = new URLSearchParams(u.split('?')[1]).get('cpf');
      return json({ configured: true, cpf: cpf.replace(/(...)(...)(...)(..)/, '$1.$2.$3-$4'), nome: 'CLIENTE DE EXEMPLO', sugestao: 'siape', setores: [
        { setor: 'siape', nome: 'SIAPE', estado: 'ok', custo: 'gratis', nota: 'grátis' },
        { setor: 'inss', nome: 'INSS', estado: 'ok', custo: 'paga', nota: 'consulta paga' },
        { setor: 'exercito', nome: 'Exército', estado: 'ok', custo: 'guardado', nota: 'consultado nas últimas 24 h, sem custo' }] });
    }
    if (u.endsWith('/nexus/consultas')) {
      await pausa(1800);
      ponte.postMessage({ type: 'demo', feito: 'cpf' });
      return json({ status: 'concluida', conversationId: 'demo', resposta: { id: 'n' + (++n), text:
        `**${SET[corpo.setor]} · CLIENTE DE EXEMPLO · 58 anos · SP**\n**Melhor opção: Banco A — R$ 4.250,00**\n\n| Banco | Libera |\n|---|---|\n| Banco A | R$ 4.250,00 |\n| Banco B ⚠️ | R$ 3.100,00 |\n\nNão passam: Banco C\n⚠️ passa com atenção · 🔎 conferir antes de digitar\n\n[[detalhes]]\nResultado inventado para a demonstração.\n\n| Banco | Resultado | Libera | Motivo |\n|---|---|---|---|\n| Banco A | ✅ Passa | R$ 4.250,00 | — |\n| Banco B | ⚠️ Atenção | R$ 3.100,00 | Conferir a margem |\n| Banco C | ❌ Não passa | — | Idade fora da regra |` } });
    }
    if (u.endsWith('/assistant/messages')) {
      ponte.postMessage({ type: 'demo', feito: 'ia' });
      const txt = resposta(corpo.text), enc = new TextEncoder();
      return new Response(new ReadableStream({ async start(c) {
        const manda = (o) => c.enqueue(enc.encode('data: ' + JSON.stringify(o) + '\n\n'));
        manda({ conversationId: 'demo' }); manda({ status: 'Consultando os roteiros…' });
        await pausa(900);
        for (const p of txt.match(/[\s\S]{1,8}/g)) { manda({ delta: p }); await pausa(25); }
        manda({ done: true, id: 'm' + (++n) }); c.close();
      } }));
    }
    return new Response('{}', { status: 404 });
  };
}

  for (const a of abas) a.p.hidden = a.item.id !== ativa;
  $('abas').replaceChildren(...abas.map((a) => {
    const x = bt('×', () => fecharAba(a.item.id), ''); x.setAttribute('aria-label', `Fechar ${a.item.name}`);
    return el('div', { className: 'aba' + (a.item.id === ativa ? ' sel' : '') }, el('button', { onclick: () => { ativa = a.item.id; desenhar(); } }, marca(a.item), a.item.name), x);
  }), ...janelas.filter((j) => j.id !== 'ia' && j.id !== 'calc').map((j) => el('div', { className: 'aba' }, bt('▢ ' + j.titulo, () => { j.n.style.zIndex = ++z; }, ''))));
  $('b-todas').hidden = abas.length < 2;
  $('b-todas').textContent = `Abas (${abas.length})`;
  mandarEstado();
}

// ------------------------------------------------------------ janelas flutuantes
function arrastar(alca, alvo, aoClicar) {
  alca.onpointerdown = (e) => {
    if (e.target !== alca && e.target.closest('button')) return;
    const r = alvo.getBoundingClientRect(), b = palco.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    let moveu = false;
    alca.setPointerCapture(e.pointerId);
    alvo.style.zIndex = ++z;
    alca.onpointermove = (v) => {
      if (Math.abs(v.clientX - e.clientX) + Math.abs(v.clientY - e.clientY) > 4) moveu = true;
      if (!moveu) return;
      alvo.style.right = alvo.style.bottom = 'auto';
      alvo.style.left = Math.max(0, Math.min(b.width - r.width, v.clientX - b.left - dx)) + 'px';
      alvo.style.top = Math.max(0, Math.min(b.height - r.height, v.clientY - b.top - dy)) + 'px';
    };
    alca.onpointerup = () => { alca.onpointermove = alca.onpointerup = null; if (!moveu && aoClicar) aoClicar(); };
  };
}
function janela(id, titulo, w, h, conteudo) {
  const ja = janelas.find((j) => j.id === id);
  if (ja) { ja.n.style.zIndex = ++z; return; }
  const x = bt('×', () => fecharJan(id), 'limpo'); x.setAttribute('aria-label', `Fechar ${titulo}`);
  const cab = el('header', {}, el('b', { textContent: titulo }), x);
  const n = el('div', { className: 'jan' }, cab, el('div', { className: 'dentro' }, conteudo));
  Object.assign(n.style, { width: w + 'px', height: h + 'px', right: 24 + janelas.length * 24 + 'px', bottom: 90 - Math.min(80, janelas.length * 12) + 'px', zIndex: ++z });
  arrastar(cab, n);
  palco.append(n); janelas.push({ id, titulo, n }); desenhar();
}
function fecharJan(id) { const j = janelas.find((x) => x.id === id); if (!j) return; j.n.remove(); janelas = janelas.filter((x) => x !== j); if (id === 'ia') fAssist = null; desenhar(); }
function calculadora() { marcar('calc'); janela('calc', 'Calculadora', 380, 540, quadro('calc', D.inicio.replace('<head>', '<head><script>window.__CALC=true<\/script>'))); }
function assistente() {
  if (janelas.some((j) => j.id === 'ia')) { fecharJan('ia'); return; }
  fAssist = quadro('assistente', D.assistente);
  janela('ia', 'Assistente Pontual', 420, 560, fAssist);
}
function texto(titulo, t, ...mais) { return el('div', { className: 'texto' }, el('h3', { textContent: titulo }), el('p', { textContent: t }), ...mais); }
function pdf() { marcar('pdf'); janela('pdf', 'Ferramentas de PDF', 620, 320, texto('Ferramentas de PDF', 'No Terminal real, abre aqui o Pontual Tools instalado no computador, para ler, compactar e converter PDF. Ele não funciona nesta demonstração.')); }
function arquivos() {
  marcar('arquivos');
  janela('arq', 'Downloads', 520, 300, texto('Downloads', 'No Terminal real, abre a pasta Downloads no explorador do Windows. Arquivos de exemplo:',
    ...['Proposta-exemplo.pdf', 'Contracheque-exemplo.pdf', 'Planilha-exemplo.xlsx'].map((f) => el('div', { textContent: '🗎 ' + f }))));
}

// ------------------------------------------------------------ aplicativos do computador
const apps = [['Bloco de Notas', 'notepad.exe', 'windows', 'allowed'], ['Paint', 'mspaint.exe', 'windows', 'allowed'], ['Microsoft Excel', 'excel.exe', 'installed', 'allowed'],
  ['VLC', 'vlc.exe', 'installed', 'request'], ['Spotify', 'spotify.exe', 'store', 'blocked'], ['Programa baixado (exemplo)', 'baixado.exe', 'downloaded', 'request']]
  .map(([name, exe, source, status], i) => ({ id: 'app' + i, name, exe, source, status, open: false }));
function abrirApp(id) {
  const a = apps.find((x) => x.id === id);
  if (!a) return;
  if (a.source === 'downloaded') { registrar(`Pedido para liberar: ${a.name}`); toast(`${a.name} foi baixado da internet e ainda não foi liberado. O TI recebeu o pedido; tente de novo depois da liberação.`); return; }
  if (a.status === 'request') { registrar(`Pedido para liberar: ${a.name}`); toast(`${a.name} foi aberto. O TI recebeu um pedido para liberar este aplicativo.`); } else registrar(`Aplicativo aberto: ${a.name}`);
  janela(a.id, a.name, 420, 200, texto(a.name, 'No Terminal real, o aplicativo do computador abre aqui.'));
}

// ------------------------------------------------------------ barra
function toast(m) { document.querySelector('.toast-d')?.remove(); const t = el('div', { className: 'toast-d', textContent: m, role: 'status' }); palco.append(t); clearTimeout(dica); dica = setTimeout(() => t.remove(), 7000); }
function fecharPops() { $('p-pesq').hidden = $('p-todas').hidden = true; }
function menu(pop, rotulo, fonte, escolher, fechar) {
  const jaAberto = !pop.hidden; fecharPops(); if (jaAberto) return;
  const campo = el('input', { className: 'campo', placeholder: rotulo }), lista = el('div', { className: 'pop-lista' });
  campo.setAttribute('aria-label', rotulo);
  const pintar = () => {
    const r = fonte().filter((i) => norm(i.name).includes(norm(campo.value.trim())));
    lista.replaceChildren(...(r.length ? r.map((i) => el('div', {}, el('button', { onclick: () => { fecharPops(); escolher(i); } }, marca(i), el('span', {}, i.name, el('small', { textContent: (i.kind === 'program' ? 'Programa' : 'Site') + ' · ' + i.group }))),
      fechar ? bt('×', () => { fechar(i); pintar(); }, 'x') : null)) : [el('p', { textContent: campo.value ? `Nada encontrado para "${campo.value}".` : 'Nenhuma aba aberta.' })]));
  };
  campo.oninput = pintar;
  campo.onkeydown = (e) => { if (e.key === 'Escape') fecharPops(); if (e.key === 'Enter') lista.querySelector('button')?.click(); };
  pop.replaceChildren(campo, lista); pop.hidden = false; pintar(); campo.focus();
}
$('b-inicio').onclick = () => { fecharPops(); ativa = null; desenhar(); };
$('b-pesq').onclick = () => { marcar('pesq'); menu($('p-pesq'), 'Digite o nome do site ou programa', () => itens, abrir); };
$('b-todas').onclick = () => menu($('p-todas'), 'Procurar entre as abas abertas', () => abas.map((a) => a.item), (i) => { ativa = i.id; desenhar(); }, (i) => fecharAba(i.id));
$('b-ti').onclick = () => { marcar('ti'); registrar('Chamado ao TI'); toast(online ? 'Chamado enviado. O TI já foi avisado.' : 'Sem conexão agora. O chamado vai ser enviado ao TI assim que a conexão voltar.'); $('b-ti').disabled = true; setTimeout(() => { $('b-ti').disabled = false; }, 8000); };
$('b-arq').onclick = arquivos; $('b-ener').onclick = energia;
palco.addEventListener('pointerdown', fecharPops);
addEventListener('blur', () => setTimeout(() => { if (document.activeElement?.tagName === 'IFRAME') fecharPops(); }, 0));
arrastar($('bolha'), $('bolha'), assistente);
$('bolha').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); assistente(); } };
function veu(conteudo, cheio) { const v = el('div', { className: 'veu-d' + (cheio ? ' cheio' : '') }, el('div', {}, ...conteudo)); document.body.append(v); return v; }
function reiniciar(frase) {
  const v = veu([el('h2', { textContent: frase }), el('p', { textContent: 'Só uma simulação: o seu computador não é afetado.' }), bt('Ligar de novo', () => { v.remove(); $('b-atual').hidden = true; })], true);
  [...abas].forEach((a) => fecharAba(a.item.id)); [...janelas].forEach((j) => fecharJan(j.id));
}
function energia() {
  marcar('energia');
  const ir = (frase) => () => { v.remove(); reiniciar(frase); };
  const v = veu([el('h2', { textContent: 'O que você quer fazer?' }), el('p', { textContent: 'As páginas abertas serão fechadas.' }),
    bt('Desligar o computador', ir('Computador desligado'), 'btn'), bt('Reiniciar o computador', ir('Reiniciando')), bt('Sair da conta', ir('Conta encerrada')), bt('Cancelar', () => v.remove())]);
}
$('b-atual').onclick = () => {
  marcar('atual');
  const v = veu([el('h2', { textContent: 'Atualizar o Terminal?' }), el('p', { textContent: 'A versão nova é instalada e o computador reinicia.' }), bt('Atualizar', () => { v.remove(); reiniciar('Atualizando e reiniciando'); }, 'btn'), bt('Agora não', () => v.remove())]);
};

// ------------------------------------------------------------ roteiro de teste e simulações
const TESTES = [['site', 'Abrir um banco da lista'], ['abas', 'Abrir um segundo site e trocar de aba'], ['pesq', 'Usar o botão Pesquisar'], ['bloqueio', 'Dentro de um site, tentar abrir um endereço não liberado'],
  ['programa', 'Abrir um programa da lista (Excel)'], ['apps', 'Ver os Aplicativos do computador'], ['calc', 'Abrir a Calculadora'], ['pdf', 'Abrir o PDF'], ['arquivos', 'Abrir os Arquivos'], ['ti', 'Chamar o TI'],
  ['ia', 'Perguntar à Assistente (botão redondo)'], ['avaliar', 'Avaliar uma resposta da Assistente'], ['cpf', 'Na Assistente, consultar o CPF de teste 529.982.247-25'], ['energia', 'Abrir Desligar ou sair'],
  ['manut', 'Simular: manutenção'], ['off', 'Simular: sem conexão'], ['atual', 'Simular: versão nova e clicar em Atualizar']];
const feitos = new Set();
const lista = el('ol'), log = el('ul', { id: 'log' }), cont = el('h3');
function pintarTestes() { cont.textContent = `O que testar (${feitos.size} de ${TESTES.length})`; lista.replaceChildren(...TESTES.map(([k, t]) => el('li', { textContent: t, className: feitos.has(k) ? 'ok' : '' }))); }
function marcar(k) { if (TESTES.some((t) => t[0] === k)) { feitos.add(k); pintarTestes(); } }
function registrar(t) { log.prepend(el('li', { textContent: new Date().toLocaleTimeString('pt-BR') + ' · ' + t })); while (log.children.length > 40) log.lastChild.remove(); }
function mudar(e, o, k) { estado = e; online = o; if (k) marcar(k); ativa = null; if (e !== 'active') [...janelas].forEach((j) => fecharJan(j.id)); $('bolha').hidden = e !== 'active'; desenhar(); $('painel').hidden = true; }
let grav = false;
$('painel').append(bt('Fechar', () => { $('painel').hidden = true; }), cont, lista, el('h3', { textContent: 'Simular situações' }),
  el('div', { className: 'sim' }, bt('Funcionando normalmente', () => mudar('active', true)), bt('Computador em manutenção', () => mudar('maintenance', true, 'manut')),
    bt('Aguardando aprovação do TI', () => mudar('pending', true)), bt('Sem conexão', () => mudar('active', false, 'off')),
    bt('Versão nova disponível', () => { $('b-atual').hidden = false; $('painel').hidden = true; toast('Tem uma versão nova do Terminal. Clique em "Atualizar" quando puder.'); }),
    bt('Ligar ou desligar o aviso de gravação', () => { grav = !grav; $('monit').className = 'monit' + (grav ? ' grava' : ''); $('monit').textContent = grav ? '● A tela e as atividades são gravadas (7h às 18h)' : 'As atividades serão monitoradas'; $('painel').hidden = true; })),
  el('h3', { textContent: 'O que o TI recebe na Central (simulado)' }), log);
pintarTestes();
$('abre-painel').onclick = () => { $('painel').hidden = !$('painel').hidden; };
const hora = () => { $('relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
hora(); setInterval(hora, 10000);
</script>
