<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demonstrativo do Terminal Pontual</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tela da atendente do Terminal Pontual.
   Cores, fonte, logo e componentes vêm do protótipo aprovado (prototipos/index.html). */
:root {
  --azul-900: #0a2f6b; --azul-700: #0d47a1; --azul-500: #1976d2; --azul-100: #e3effc; --azul-50: #f3f8fe;
  --verde-700: #1f7a45; --verde-500: #2e9e5b; --verde-400: #10b981; --verde-100: #def6e9;
  --tinta: #0f172a; --texto: #334155; --suave: #64748b; --apagado: #94a3b8;
  --linha: #e6ebf2; --linha-forte: #cfd8e3; --fundo: #f7f9fc; --branco: #fff;
  --ambar-700: #b45309; --ambar-100: #fef3c7; --rubi-700: #b91c1c; --rubi-100: #fee2e2;
  --marca: linear-gradient(100deg, var(--azul-700), var(--azul-500) 55%, var(--verde-400));
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
  --s-1: 0 1px 2px rgba(15, 23, 42, 0.05);
  --s-2: 0 2px 6px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.07);
  --s-3: 0 8px 20px rgba(15, 23, 42, 0.08), 0 32px 72px rgba(15, 23, 42, 0.18);
  --t: 160ms ease-out;
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
html, body { margin: 0; }
body { font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; color: var(--texto); background: var(--branco); }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { color: var(--tinta); font-weight: 600; line-height: 1.15; text-wrap: balance; }
p { text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--azul-500); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
svg { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }
.caixa-pagina { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }

/* ---------------------------------------------------------- componentes */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; background: var(--azul-700); color: var(--branco); font-weight: 500; white-space: nowrap; transition: background-color var(--t), border-color var(--t), transform var(--t), box-shadow var(--t); }
.btn:hover { background: var(--azul-900); box-shadow: 0 6px 16px rgba(13, 71, 161, 0.25); }
.btn:active { transform: scale(0.97); }
.btn.claro { background: var(--branco); color: var(--tinta); border-color: var(--linha-forte); }
.btn.claro:hover { background: var(--fundo); border-color: var(--apagado); box-shadow: none; }
.btn.verde { background: var(--verde-500); } .btn.verde:hover { background: var(--verde-700); box-shadow: 0 6px 16px rgba(46, 158, 91, 0.25); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--branco); font-size: 13px; font-weight: 600; }
.avatar.g { width: 48px; height: 48px; font-size: 16px; } .avatar.gg { width: 56px; height: 56px; font-size: 18px; border-radius: 16px; }
.avatar.logo-marca { background: var(--branco); border: 1px solid var(--linha); overflow: hidden; padding: 3px; }
.avatar.logo-marca img { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; border-radius: 6px; }
.avatar.q { border-radius: 12px; } .avatar.m { width: 28px; height: 28px; font-size: 11px; }
.guias { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); }
.guias button { min-height: 44px; padding: 0 14px; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--suave); font-weight: 500; transition: color var(--t), border-color var(--t); }
.guias button:hover { color: var(--tinta); }
.guias button[aria-selected="true"] { color: var(--azul-700); border-bottom-color: var(--azul-700); }
.vazio { padding: 40px 16px; text-align: center; color: var(--suave); }

/* ----------------------------------------------------------------- topo */
.topo { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linha); }
.topo > div { display: flex; align-items: center; gap: 24px; min-height: 72px; }
/* O arquivo da logo é quadrado, com muita margem; a moldura corta a margem. */
.logo { display: inline-flex; align-items: center; justify-content: center; width: 168px; height: 44px; overflow: hidden; flex: none; }
.logo img { width: 184px; height: 184px; flex: none; }
.logo-texto { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--azul-700); } .logo-texto em { font-style: normal; color: var(--verde-500); }
.topo .fim { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.topo .topo-btn { min-height: 44px; padding: 0 16px; font-size: 14px; }
.ligado { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--verde-700); }
.ligado::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--verde-400); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18); }
.ligado.sem { color: var(--rubi-700); font-weight: 500; }
.ligado.sem::before { background: var(--rubi-700); box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.16); }
.ligado.espera { color: var(--suave); }
.ligado.espera::before { background: var(--apagado); box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.2); }
.hora { font-size: 13px; color: var(--suave); text-align: right; line-height: 1.3; } .hora b { display: block; font-size: 17px; font-weight: 600; color: var(--tinta); }
.eu { display: flex; align-items: center; gap: 10px; } .eu b { display: block; color: var(--tinta); font-weight: 600; font-size: 14px; line-height: 1.3; } .eu small { color: var(--suave); font-size: 12px; }

/* ------------------------------------------------------------ atendente */
.app { min-height: 100vh; display: flex; flex-direction: column; background: var(--branco); position: relative; }
.heroi { padding: 72px 0 40px; text-align: center; background: radial-gradient(900px 320px at 50% -80px, var(--azul-50), transparent 70%); }
.heroi h1 { font-size: clamp(34px, 4.4vw, 52px); letter-spacing: -0.035em; font-weight: 600; }
.heroi h1 span { background: var(--marca); -webkit-background-clip: text; background-clip: text; color: transparent; }
.heroi > div > p { margin-top: 10px; font-size: 17px; color: var(--suave); }
.procura { position: relative; width: min(640px, 100%); margin: 32px auto 0; }
.procura input { width: 100%; height: 64px; padding: 0 76px 0 58px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--branco); font-size: 18px; color: var(--tinta); box-shadow: var(--s-2); transition: border-color var(--t), box-shadow var(--t); }
.procura input::placeholder { color: var(--apagado); }
.procura input:focus { outline: none; border-color: var(--azul-500); box-shadow: 0 0 0 5px rgba(25, 118, 210, 0.14), var(--s-2); }
.procura input::-webkit-search-cancel-button { display: none; }
.procura > svg { position: absolute; left: 22px; top: 21px; color: var(--azul-700); }
.procura kbd { position: absolute; right: 20px; top: 19px; height: 26px; padding: 0 10px; border-radius: 8px; background: #eef1f5; color: var(--suave); font: 500 12px 'Poppins', sans-serif; display: grid; place-items: center; }
.bloco { padding: 20px 0; }
.bloco > h2 { font-size: 15px; font-weight: 600; color: var(--suave); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.abertos { display: flex; gap: 10px; flex-wrap: wrap; }
.aberto { display: inline-flex; align-items: center; height: 48px; border-radius: 999px; border: 1px solid var(--azul-100); background: var(--azul-50); transition: border-color var(--t), box-shadow var(--t); }
.aberto:hover { border-color: var(--azul-500); box-shadow: var(--s-1); }
.aberto button { border: none; background: none; height: 100%; display: inline-flex; align-items: center; gap: 10px; padding: 0 6px 0 8px; color: var(--azul-900); font-weight: 500; border-radius: 999px; }
.aberto .x { padding: 0 14px 0 6px; color: var(--apagado); } .aberto .x:hover { color: var(--rubi-700); }
.destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.destaque { display: grid; gap: 18px; justify-items: start; text-align: left; padding: 22px; border-radius: var(--r-lg); border: 1px solid var(--linha); background: var(--branco); transition: transform var(--t), box-shadow var(--t), border-color var(--t); }
.destaque:hover { transform: translateY(-4px); box-shadow: var(--s-2); border-color: transparent; }
.destaque:active { transform: scale(0.98); }
.destaque b { display: block; color: var(--tinta); font-weight: 600; font-size: 16px; line-height: 1.25; }
.destaque small { color: var(--suave); font-size: 13px; }
.todos-topo { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
.todos-topo h2 { font-size: 22px; letter-spacing: -0.01em; }
.lista-sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 32px; margin-top: 8px; }
.item { display: grid; grid-template-columns: 40px 1fr 20px; gap: 14px; align-items: center; text-align: left; padding: 12px 10px; margin: 0 -10px; border: none; border-bottom: 1px solid var(--linha); background: none; border-radius: var(--r-sm); transition: background-color var(--t); }
.item:hover { background: var(--fundo); }
.item > span { min-width: 0; }
.item b { display: block; color: var(--tinta); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { display: block; color: var(--apagado); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item > svg { color: var(--linha-forte); transition: color var(--t), transform var(--t); } .item:hover > svg { color: var(--azul-500); transform: translateX(3px); }
.rodape { margin-top: auto; border-top: 1px solid var(--linha); background: var(--fundo); }
.rodape > div { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; min-height: 76px; padding: 14px 0; font-size: 13px; color: var(--suave); }
.rodape .elo { border: none; background: none; padding: 0; min-height: 44px; color: var(--azul-700); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.rodape .fim { margin-left: auto; text-align: right; }

/* Carregando, aguardando aprovação e cadastro inválido: mesmo desenho da tela de manutenção, dentro da página. */
.estado { flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 24px; background: radial-gradient(900px 320px at 50% -80px, var(--azul-50), transparent 70%); }
.estado i { width: 96px; height: 96px; border-radius: 28px; background: var(--azul-50); color: var(--azul-700); display: grid; place-items: center; margin: 0 auto 24px; }
.estado i.ambar { background: var(--ambar-100); color: var(--ambar-700); }
.estado i.rubi { background: var(--rubi-100); color: var(--rubi-700); }
.estado h1 { font-size: 36px; letter-spacing: -0.02em; margin-bottom: 10px; }
.estado p { max-width: 46ch; margin: 0 auto; font-size: 17px; color: var(--suave); }
.estado p strong { color: var(--tinta); font-weight: 600; }
.girando svg { animation: gira 1.1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

.manut { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; padding: 32px; background: var(--branco); }
.manut:focus { outline: none; }
.manut i { width: 96px; height: 96px; border-radius: 28px; background: var(--azul-50); color: var(--azul-700); display: grid; place-items: center; margin: 0 auto 24px; }
.manut h2 { font-size: 36px; letter-spacing: -0.02em; margin-bottom: 10px; } .manut p { max-width: 44ch; margin: 0 auto; font-size: 17px; color: var(--suave); }
.veu { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 20px; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(3px); animation: surge 160ms ease-out; }
.folha { width: min(520px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--branco); border-radius: var(--r-xl); padding: 32px; box-shadow: var(--s-3); animation: sobe 220ms ease-out; }
.folha h2 { font-size: 24px; letter-spacing: -0.01em; margin-bottom: 8px; }
.folha h3 { font-size: 13px; color: var(--suave); margin: 18px 0 6px; font-weight: 500; }
.folha ul { margin: 0; padding-left: 18px; }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
.folha.larga { width: min(720px, 100%); }
.folha.calc { width: min(400px, 100%); }
.calc-visor { background: var(--fundo); border: 1px solid var(--linha); border-radius: var(--r-md); padding: 14px 16px; text-align: right; margin-top: 10px; }
.calc-ultima { font-size: 13px; color: var(--apagado); min-height: 18px; }
.calc-expr { font-size: 18px; color: var(--suave); min-height: 26px; word-break: break-all; }
.calc-res { font-size: 34px; font-weight: 600; color: var(--tinta); min-height: 42px; word-break: break-all; }
.calc-res.erro { font-size: 18px; color: var(--rubi-700); line-height: 42px; }
.calc-teclas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.calc-teclas button { font: inherit; font-size: 20px; font-weight: 500; padding: 14px 0; border-radius: var(--r-md); border: 1px solid var(--linha); background: var(--branco); color: var(--tinta); cursor: pointer; transition: background-color var(--t), transform var(--t); }
.calc-teclas button:hover { background: var(--fundo); } .calc-teclas button:active { transform: scale(0.96); }
.calc-teclas .op { background: var(--fundo); color: var(--azul-500); }
.calc-teclas .igual { background: var(--azul-500); border-color: var(--azul-500); color: #fff; } .calc-teclas .igual:hover { filter: brightness(1.08); background: var(--azul-500); }
.calc-teclas .apaga { color: var(--rubi-700); }
.calc-dica { font-size: 12.5px; color: var(--apagado); margin-top: 12px; }
/* Calculadora em janela própria do Windows (?calc=1): ocupa a janela toda e as teclas crescem com ela. */
body.modo-calc { overflow: hidden; }
.calc-janela { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 12px; background: var(--branco); }
.calc-janela .calc-visor { margin-top: 0; flex: 0 0 auto; }
.calc-janela .calc-res { font-size: clamp(26px, 9vw, 42px); min-height: 1.2em; }
.calc-janela .calc-res.erro { font-size: 18px; line-height: 1.2em; }
.calc-janela .calc-teclas { flex: 1 1 auto; min-height: 0; grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.calc-janela .calc-teclas button { padding: 0; height: 100%; min-height: 0; font-size: clamp(16px, 5.5vw, 26px); }
.folha .explica { color: var(--suave); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
.folha .procura-apps { width: 100%; padding: 10px 12px; border: 1px solid var(--linha); border-radius: var(--r-sm); background: var(--fundo); color: var(--tinta); font: inherit; font-size: 15px; margin-bottom: 6px; }
.folha .procura-apps:focus { outline: 2px solid var(--azul-500); outline-offset: 1px; }
.folha .lista-sites { grid-template-columns: 1fr; margin-top: 0; }
.folha .item[disabled] { opacity: 0.55; cursor: not-allowed; } .folha .item[disabled]:hover { background: none; }
.folha .item[disabled] > svg { color: var(--apagado); transform: none; }
@keyframes surge { from { opacity: 0; } } @keyframes sobe { from { opacity: 0; transform: translateY(10px); } } @keyframes desliza { from { transform: translateX(32px); opacity: 0; } }

.avisos { position: fixed; right: 20px; top: 92px; z-index: 70; display: grid; gap: 10px; width: min(360px, calc(100vw - 40px)); }
.toast { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 16px; border-radius: var(--r-md); background: var(--branco); border: 1px solid var(--linha); box-shadow: var(--s-3); color: var(--tinta); font-size: 14px; animation: desliza 240ms ease-out; }
.toast svg { color: var(--verde-500); margin-top: 1px; }
.toast.urgente { border-color: #f5b5b5; border-left: 5px solid var(--rubi-700); } .toast.urgente svg { color: var(--rubi-700); }

@media (max-width: 900px) {
  .topo > div { flex-wrap: wrap; padding: 10px 0; }
  .hora { display: none; }
  .heroi { padding: 44px 0 24px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

html, body { height: 100%; overflow: hidden; }
body { display: grid; grid-template-rows: auto 1fr auto; }
.faixa { display: flex; align-items: center; gap: 12px; padding: 6px 16px; background: #fef3c7; color: #78350f; font-size: 13px; }
.faixa span { flex: 1; min-width: 0; }
.faixa .btn { min-height: 32px; padding: 0 14px; font-size: 13px; }
#palco { position: relative; min-height: 0; overflow: hidden; background: var(--fundo); }
#palco > iframe, .pagina { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pagina { background: var(--fundo); display: grid; place-items: center; padding: 24px; overflow: auto; text-align: center; }
.pagina > div { max-width: 560px; display: grid; gap: 14px; justify-items: center; }
.pagina h2 { font-size: 28px; } .pagina p { color: var(--suave); font-size: 16px; }
.bola { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: var(--rubi-100); color: var(--rubi-700); font-size: 44px; }
.linha { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.campo { padding: 9px 14px; border: 1px solid var(--linha-forte); border-radius: 10px; width: 100%; }
#barra { background: #fff; border-top: 1px solid var(--linha); padding: 0 16px 4px; position: relative; z-index: 30; min-width: 0; }
.monit { text-align: center; font-size: 11px; line-height: 14px; color: var(--apagado); }
.monit.grava { color: var(--rubi-700); }
.barra-l { display: flex; align-items: center; gap: 8px; height: 46px; }
.barra-l .btn { min-height: 38px; padding: 0 14px; font-size: 14px; }
#abas { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.aba { display: flex; align-items: center; flex: none; height: 42px; border: 1px solid var(--linha); border-radius: 21px; padding: 0 4px 0 6px; }
.aba.sel { background: var(--azul-50); border-color: var(--azul-100); }
.aba button, .limpo { border: 0; background: none; min-height: 38px; min-width: 32px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.limpo { justify-content: center; font-size: 19px; color: var(--suave); min-width: 40px; }
.pop { position: absolute; bottom: calc(100% + 8px); left: 110px; width: min(380px, calc(100vw - 32px)); background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 12px; box-shadow: var(--s-3); }
.pop.dir { left: auto; right: 16px; }
.pop-lista { max-height: 320px; overflow: auto; margin-top: 8px; }
.pop-lista > div { display: flex; }
.pop-lista button { border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 6px; text-align: left; border-radius: 8px; flex: 1; }
.pop-lista button.x { flex: none; }
.pop-lista button:hover { background: var(--azul-50); }
.pop-lista small { display: block; color: var(--suave); }
.jan { position: absolute; background: #fff; border: 1px solid var(--linha-forte); border-radius: 10px; box-shadow: var(--s-3); display: flex; flex-direction: column; overflow: hidden; z-index: 20; max-width: calc(100% - 16px); max-height: calc(100% - 16px); }
.jan header { display: flex; align-items: center; padding: 2px 4px 2px 12px; font-size: 13px; cursor: move; border-bottom: 1px solid var(--linha); user-select: none; touch-action: none; }
.jan header b { flex: 1; font-weight: 500; }
.jan .dentro { flex: 1; min-height: 0; overflow: auto; } .jan .texto { padding: 20px; display: grid; gap: 12px; }
.jan iframe { width: 100%; height: 100%; border: 0; display: block; }
#bolha { position: absolute; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid #fff; background: linear-gradient(135deg, #0d47a1, #1976d2 55%, #10b981); color: #fff; font-size: 26px; box-shadow: 0 3px 14px rgba(15,23,42,.32); z-index: 25; touch-action: none; }
.toast-d { pointer-events: none; position: absolute; top: 16px; right: 16px; width: min(380px, calc(100% - 32px)); padding: 16px; background: #fff; border: 1px solid var(--linha-forte); border-radius: 14px; box-shadow: var(--s-2); color: var(--tinta); font-size: 14px; z-index: 60; }
.veu-d { position: fixed; inset: 0; z-index: 80; background: rgba(15,23,42,.45); display: grid; place-items: center; padding: 16px; }
.veu-d > div { background: #fff; border-radius: 14px; padding: 24px 28px; width: min(420px, 100%); display: grid; gap: 8px; }
.veu-d.cheio { background: #0a2f6b; color: #fff; } .veu-d.cheio > div { background: none; text-align: center; justify-items: center; } .veu-d.cheio h2 { color: #fff; }

<script>
const D = {"inicio":"\u003c!doctype html>\r\n\u003chtml lang=\"pt-BR\">\r\n\u003chead>\r\n\u003cmeta charset=\"utf-8\">\r\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n\u003cmeta name=\"referrer\" content=\"no-referrer\">\r\n\u003ctitle>Terminal Pontual\u003c/title>\r\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\r\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\r\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\r\n\u003cstyle>/* Tela da atendente do Terminal Pontual.\r\n   Cores, fonte, logo e componentes vêm do protótipo aprovado (prototipos/index.html). */\r\n:root {\r\n  --azul-900: #0a2f6b; --azul-700: #0d47a1; --azul-500: #1976d2; --azul-100: #e3effc; --azul-50: #f3f8fe;\r\n  --verde-700: #1f7a45; --verde-500: #2e9e5b; --verde-400: #10b981; --verde-100: #def6e9;\r\n  --tinta: #0f172a; --texto: #334155; --suave: #64748b; --apagado: #94a3b8;\r\n  --linha: #e6ebf2; --linha-forte: #cfd8e3; --fundo: #f7f9fc; --branco: #fff;\r\n  --ambar-700: #b45309; --ambar-100: #fef3c7; --rubi-700: #b91c1c; --rubi-100: #fee2e2;\r\n  --marca: linear-gradient(100deg, var(--azul-700), var(--azul-500) 55%, var(--verde-400));\r\n  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;\r\n  --s-1: 0 1px 2px rgba(15, 23, 42, 0.05);\r\n  --s-2: 0 2px 6px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.07);\r\n  --s-3: 0 8px 20px rgba(15, 23, 42, 0.08), 0 32px 72px rgba(15, 23, 42, 0.18);\r\n  --t: 160ms ease-out;\r\n}\r\n* { box-sizing: border-box; }\r\nhtml { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }\r\nhtml, body { margin: 0; }\r\nbody { font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; color: var(--texto); background: var(--branco); }\r\nh1, h2, h3, h4, p { margin: 0; }\r\nh1, h2, h3, h4 { color: var(--tinta); font-weight: 600; line-height: 1.15; text-wrap: balance; }\r\np { text-wrap: pretty; }\r\nbutton, input, select { font: inherit; color: inherit; }\r\nbutton { cursor: pointer; }\r\n:focus-visible { outline: 3px solid var(--azul-500); outline-offset: 3px; border-radius: 6px; }\r\n[hidden] { display: none !important; }\r\nsvg { flex: none; display: block; }\r\n.num { font-variant-numeric: tabular-nums; }\r\n.caixa-pagina { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }\r\n\r\n/* ---------------------------------------------------------- componentes */\r\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; background: var(--azul-700); color: var(--branco); font-weight: 500; white-space: nowrap; transition: background-color var(--t), border-color var(--t), transform var(--t), box-shadow var(--t); }\r\n.btn:hover { background: var(--azul-900); box-shadow: 0 6px 16px rgba(13, 71, 161, 0.25); }\r\n.btn:active { transform: scale(0.97); }\r\n.btn.claro { background: var(--branco); color: var(--tinta); border-color: var(--linha-forte); }\r\n.btn.claro:hover { background: var(--fundo); border-color: var(--apagado); box-shadow: none; }\r\n.btn.verde { background: var(--verde-500); } .btn.verde:hover { background: var(--verde-700); box-shadow: 0 6px 16px rgba(46, 158, 91, 0.25); }\r\n.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }\r\n.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--branco); font-size: 13px; font-weight: 600; }\r\n.avatar.g { width: 48px; height: 48px; font-size: 16px; } .avatar.gg { width: 56px; height: 56px; font-size: 18px; border-radius: 16px; }\r\n.avatar.logo-marca { background: var(--branco); border: 1px solid var(--linha); overflow: hidden; padding: 3px; }\r\n.avatar.logo-marca img { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; border-radius: 6px; }\r\n.avatar.q { border-radius: 12px; } .avatar.m { width: 28px; height: 28px; font-size: 11px; }\r\n.guias { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); }\r\n.guias button { min-height: 44px; padding: 0 14px; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--suave); font-weight: 500; transition: color var(--t), border-color var(--t); }\r\n.guias button:hover { color: var(--tinta); }\r\n.guias button[aria-selected=\"true\"] { color: var(--azul-700); border-bottom-color: var(--azul-700); }\r\n.vazio { padding: 40px 16px; text-align: center; color: var(--suave); }\r\n\r\n/* ----------------------------------------------------------------- topo */\r\n.topo { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linha); }\r\n.topo > div { display: flex; align-items: center; gap: 24px; min-height: 72px; }\r\n/* O arquivo da logo é quadrado, com muita margem; a moldura corta a margem. */\r\n.logo { display: inline-flex; align-items: center; justify-content: center; width: 168px; height: 44px; overflow: hidden; flex: none; }\r\n.logo img { width: 184px; height: 184px; flex: none; }\r\n.logo-texto { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--azul-700); } .logo-texto em { font-style: normal; color: var(--verde-500); }\r\n.topo .fim { margin-left: auto; display: flex; align-items: center; gap: 16px; }\r\n.topo .topo-btn { min-height: 44px; padding: 0 16px; font-size: 14px; }\r\n.ligado { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--verde-700); }\r\n.ligado::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--verde-400); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18); }\r\n.ligado.sem { color: var(--rubi-700); font-weight: 500; }\r\n.ligado.sem::before { background: var(--rubi-700); box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.16); }\r\n.ligado.espera { color: var(--suave); }\r\n.ligado.espera::before { background: var(--apagado); box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.2); }\r\n.hora { font-size: 13px; color: var(--suave); text-align: right; line-height: 1.3; } .hora b { display: block; font-size: 17px; font-weight: 600; color: var(--tinta); }\r\n.eu { display: flex; align-items: center; gap: 10px; } .eu b { display: block; color: var(--tinta); font-weight: 600; font-size: 14px; line-height: 1.3; } .eu small { color: var(--suave); font-size: 12px; }\r\n\r\n/* ------------------------------------------------------------ atendente */\r\n.app { min-height: 100vh; display: flex; flex-direction: column; background: var(--branco); position: relative; }\r\n.heroi { padding: 72px 0 40px; text-align: center; background: radial-gradient(900px 320px at 50% -80px, var(--azul-50), transparent 70%); }\r\n.heroi h1 { font-size: clamp(34px, 4.4vw, 52px); letter-spacing: -0.035em; font-weight: 600; }\r\n.heroi h1 span { background: var(--marca); -webkit-background-clip: text; background-clip: text; color: transparent; }\r\n.heroi > div > p { margin-top: 10px; font-size: 17px; color: var(--suave); }\r\n.procura { position: relative; width: min(640px, 100%); margin: 32px auto 0; }\r\n.procura input { width: 100%; height: 64px; padding: 0 76px 0 58px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--branco); font-size: 18px; color: var(--tinta); box-shadow: var(--s-2); transition: border-color var(--t), box-shadow var(--t); }\r\n.procura input::placeholder { color: var(--apagado); }\r\n.procura input:focus { outline: none; border-color: var(--azul-500); box-shadow: 0 0 0 5px rgba(25, 118, 210, 0.14), var(--s-2); }\r\n.procura input::-webkit-search-cancel-button { display: none; }\r\n.procura > svg { position: absolute; left: 22px; top: 21px; color: var(--azul-700); }\r\n.procura kbd { position: absolute; right: 20px; top: 19px; height: 26px; padding: 0 10px; border-radius: 8px; background: #eef1f5; color: var(--suave); font: 500 12px 'Poppins', sans-serif; display: grid; place-items: center; }\r\n.bloco { padding: 20px 0; }\r\n.bloco > h2 { font-size: 15px; font-weight: 600; color: var(--suave); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }\r\n.abertos { display: flex; gap: 10px; flex-wrap: wrap; }\r\n.aberto { display: inline-flex; align-items: center; height: 48px; border-radius: 999px; border: 1px solid var(--azul-100); background: var(--azul-50); transition: border-color var(--t), box-shadow var(--t); }\r\n.aberto:hover { border-color: var(--azul-500); box-shadow: var(--s-1); }\r\n.aberto button { border: none; background: none; height: 100%; display: inline-flex; align-items: center; gap: 10px; padding: 0 6px 0 8px; color: var(--azul-900); font-weight: 500; border-radius: 999px; }\r\n.aberto .x { padding: 0 14px 0 6px; color: var(--apagado); } .aberto .x:hover { color: var(--rubi-700); }\r\n.destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }\r\n.destaque { display: grid; gap: 18px; justify-items: start; text-align: left; padding: 22px; border-radius: var(--r-lg); border: 1px solid var(--linha); background: var(--branco); transition: transform var(--t), box-shadow var(--t), border-color var(--t); }\r\n.destaque:hover { transform: translateY(-4px); box-shadow: var(--s-2); border-color: transparent; }\r\n.destaque:active { transform: scale(0.98); }\r\n.destaque b { display: block; color: var(--tinta); font-weight: 600; font-size: 16px; line-height: 1.25; }\r\n.destaque small { color: var(--suave); font-size: 13px; }\r\n.todos-topo { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }\r\n.todos-topo h2 { font-size: 22px; letter-spacing: -0.01em; }\r\n.lista-sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 32px; margin-top: 8px; }\r\n.item { display: grid; grid-template-columns: 40px 1fr 20px; gap: 14px; align-items: center; text-align: left; padding: 12px 10px; margin: 0 -10px; border: none; border-bottom: 1px solid var(--linha); background: none; border-radius: var(--r-sm); transition: background-color var(--t); }\r\n.item:hover { background: var(--fundo); }\r\n.item > span { min-width: 0; }\r\n.item b { display: block; color: var(--tinta); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.item small { display: block; color: var(--apagado); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.item > svg { color: var(--linha-forte); transition: color var(--t), transform var(--t); } .item:hover > svg { color: var(--azul-500); transform: translateX(3px); }\r\n.rodape { margin-top: auto; border-top: 1px solid var(--linha); background: var(--fundo); }\r\n.rodape > div { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; min-height: 76px; padding: 14px 0; font-size: 13px; color: var(--suave); }\r\n.rodape .elo { border: none; background: none; padding: 0; min-height: 44px; color: var(--azul-700); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }\r\n.rodape .fim { margin-left: auto; text-align: right; }\r\n\r\n/* Carregando, aguardando aprovação e cadastro inválido: mesmo desenho da tela de manutenção, dentro da página. */\r\n.estado { flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 24px; background: radial-gradient(900px 320px at 50% -80px, var(--azul-50), transparent 70%); }\r\n.estado i { width: 96px; height: 96px; border-radius: 28px; background: var(--azul-50); color: var(--azul-700); display: grid; place-items: center; margin: 0 auto 24px; }\r\n.estado i.ambar { background: var(--ambar-100); color: var(--ambar-700); }\r\n.estado i.rubi { background: var(--rubi-100); color: var(--rubi-700); }\r\n.estado h1 { font-size: 36px; letter-spacing: -0.02em; margin-bottom: 10px; }\r\n.estado p { max-width: 46ch; margin: 0 auto; font-size: 17px; color: var(--suave); }\r\n.estado p strong { color: var(--tinta); font-weight: 600; }\r\n.girando svg { animation: gira 1.1s linear infinite; }\r\n@keyframes gira { to { transform: rotate(360deg); } }\r\n\r\n.manut { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; padding: 32px; background: var(--branco); }\r\n.manut:focus { outline: none; }\r\n.manut i { width: 96px; height: 96px; border-radius: 28px; background: var(--azul-50); color: var(--azul-700); display: grid; place-items: center; margin: 0 auto 24px; }\r\n.manut h2 { font-size: 36px; letter-spacing: -0.02em; margin-bottom: 10px; } .manut p { max-width: 44ch; margin: 0 auto; font-size: 17px; color: var(--suave); }\r\n.veu { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 20px; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(3px); animation: surge 160ms ease-out; }\r\n.folha { width: min(520px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--branco); border-radius: var(--r-xl); padding: 32px; box-shadow: var(--s-3); animation: sobe 220ms ease-out; }\r\n.folha h2 { font-size: 24px; letter-spacing: -0.01em; margin-bottom: 8px; }\r\n.folha h3 { font-size: 13px; color: var(--suave); margin: 18px 0 6px; font-weight: 500; }\r\n.folha ul { margin: 0; padding-left: 18px; }\r\n.acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }\r\n.folha.larga { width: min(720px, 100%); }\r\n.folha.calc { width: min(400px, 100%); }\r\n.calc-visor { background: var(--fundo); border: 1px solid var(--linha); border-radius: var(--r-md); padding: 14px 16px; text-align: right; margin-top: 10px; }\r\n.calc-ultima { font-size: 13px; color: var(--apagado); min-height: 18px; }\r\n.calc-expr { font-size: 18px; color: var(--suave); min-height: 26px; word-break: break-all; }\r\n.calc-res { font-size: 34px; font-weight: 600; color: var(--tinta); min-height: 42px; word-break: break-all; }\r\n.calc-res.erro { font-size: 18px; color: var(--rubi-700); line-height: 42px; }\r\n.calc-teclas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }\r\n.calc-teclas button { font: inherit; font-size: 20px; font-weight: 500; padding: 14px 0; border-radius: var(--r-md); border: 1px solid var(--linha); background: var(--branco); color: var(--tinta); cursor: pointer; transition: background-color var(--t), transform var(--t); }\r\n.calc-teclas button:hover { background: var(--fundo); } .calc-teclas button:active { transform: scale(0.96); }\r\n.calc-teclas .op { background: var(--fundo); color: var(--azul-500); }\r\n.calc-teclas .igual { background: var(--azul-500); border-color: var(--azul-500); color: #fff; } .calc-teclas .igual:hover { filter: brightness(1.08); background: var(--azul-500); }\r\n.calc-teclas .apaga { color: var(--rubi-700); }\r\n.calc-dica { font-size: 12.5px; color: var(--apagado); margin-top: 12px; }\r\n/* Calculadora em janela própria do Windows (?calc=1): ocupa a janela toda e as teclas crescem com ela. */\r\nbody.modo-calc { overflow: hidden; }\r\n.calc-janela { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 12px; background: var(--branco); }\r\n.calc-janela .calc-visor { margin-top: 0; flex: 0 0 auto; }\r\n.calc-janela .calc-res { font-size: clamp(26px, 9vw, 42px); min-height: 1.2em; }\r\n.calc-janela .calc-res.erro { font-size: 18px; line-height: 1.2em; }\r\n.calc-janela .calc-teclas { flex: 1 1 auto; min-height: 0; grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }\r\n.calc-janela .calc-teclas button { padding: 0; height: 100%; min-height: 0; font-size: clamp(16px, 5.5vw, 26px); }\r\n.folha .explica { color: var(--suave); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }\r\n.folha .procura-apps { width: 100%; padding: 10px 12px; border: 1px solid var(--linha); border-radius: var(--r-sm); background: var(--fundo); color: var(--tinta); font: inherit; font-size: 15px; margin-bottom: 6px; }\r\n.folha .procura-apps:focus { outline: 2px solid var(--azul-500); outline-offset: 1px; }\r\n.folha .lista-sites { grid-template-columns: 1fr; margin-top: 0; }\r\n.folha .item[disabled] { opacity: 0.55; cursor: not-allowed; } .folha .item[disabled]:hover { background: none; }\r\n.folha .item[disabled] > svg { color: var(--apagado); transform: none; }\r\n@keyframes surge { from { opacity: 0; } } @keyframes sobe { from { opacity: 0; transform: translateY(10px); } } @keyframes desliza { from { transform: translateX(32px); opacity: 0; } }\r\n\r\n.avisos { position: fixed; right: 20px; top: 92px; z-index: 70; display: grid; gap: 10px; width: min(360px, calc(100vw - 40px)); }\r\n.toast { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 16px; border-radius: var(--r-md); background: var(--branco); border: 1px solid var(--linha); box-shadow: var(--s-3); color: var(--tinta); font-size: 14px; animation: desliza 240ms ease-out; }\r\n.toast svg { color: var(--verde-500); margin-top: 1px; }\r\n.toast.urgente { border-color: #f5b5b5; border-left: 5px solid var(--rubi-700); } .toast.urgente svg { color: var(--rubi-700); }\r\n\r\n@media (max-width: 900px) {\r\n  .topo > div { flex-wrap: wrap; padding: 10px 0; }\r\n  .hora { display: none; }\r\n  .heroi { padding: 44px 0 24px; }\r\n}\r\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\r\n\u003c/style>\r\n\u003c/head>\r\n\u003cbody>\r\n\r\n\u003cdiv class=\"app\" id=\"app-at\">\r\n  \u003cheader class=\"topo\">\u003cdiv class=\"caixa-pagina\">\r\n    \u003cspan class=\"logo\" data-logo>\u003c/span>\r\n    \u003cdiv class=\"fim\">\r\n      \u003cspan class=\"ligado\" id=\"ligacao\" role=\"status\">Conectando\u003c/span>\r\n      \u003cspan class=\"hora\">\u003cb data-hora>--:--\u003c/b>\u003cspan data-data>\u003c/span>\u003c/span>\r\n      \u003c!-- Só no modo bloqueado (programa instalado com bloqueio): fazem a vez do menu Iniciar. -->\r\n      \u003cbutton type=\"button\" class=\"btn claro topo-btn\" id=\"at-calc\">\u003cspan data-ic=\"calc\">\u003c/span>Calculadora\u003c/button>\r\n      \u003c!-- Ferramentas de PDF (ler, compactar, converter): só no Terminal que tem o Pontual Tools (P.pdf). -->\r\n      \u003cbutton type=\"button\" class=\"btn claro topo-btn\" id=\"at-pdf\" hidden>\u003cspan data-ic=\"pdf\">\u003c/span>PDF\u003c/button>\r\n      \u003cbutton type=\"button\" class=\"btn claro topo-btn\" id=\"at-aplicativos\" hidden>\u003cspan data-ic=\"grid\">\u003c/span>Aplicativos\u003c/button>\r\n      \u003cbutton type=\"button\" class=\"btn claro topo-btn\" id=\"at-arquivos\" hidden>\u003cspan data-ic=\"folder\">\u003c/span>Arquivos\u003c/button>\r\n      \u003cbutton type=\"button\" class=\"btn claro topo-btn\" id=\"at-energia\" hidden>\u003cspan data-ic=\"power\">\u003c/span>Desligar ou sair\u003c/button>\r\n      \u003cspan class=\"eu\" id=\"eu\" hidden>\u003cspan class=\"avatar\" id=\"eu-avatar\">\u003c/span>\u003cspan>\u003cb id=\"eu-nome\">\u003c/b>\u003csmall id=\"eu-pc\">\u003c/small>\u003c/span>\u003c/span>\r\n    \u003c/div>\r\n  \u003c/div>\u003c/header>\r\n\r\n  \u003c!-- Carregando, aguardando aprovação, cadastro inválido -->\r\n  \u003cmain id=\"at-estado\" class=\"estado\">\r\n    \u003cdiv>\r\n      \u003ci id=\"estado-icone\">\u003c/i>\r\n      \u003ch1 id=\"estado-titulo\">Carregando\u003c/h1>\r\n      \u003cp id=\"estado-texto\">Buscando o que está liberado para você.\u003c/p>\r\n    \u003c/div>\r\n  \u003c/main>\r\n\r\n  \u003cmain id=\"at-inicio\" hidden>\r\n    \u003csection class=\"heroi\">\u003cdiv class=\"caixa-pagina\">\r\n      \u003ch1 id=\"saudacao\">\u003c/h1>\r\n      \u003cp id=\"saudacao-sub\">\u003c/p>\r\n      \u003cdiv class=\"procura\">\r\n        \u003cspan data-ic=\"search\" data-tam=\"22\">\u003c/span>\r\n        \u003cinput id=\"busca\" type=\"search\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Digite o nome do banco ou da ferramenta\" aria-label=\"Buscar banco ou ferramenta\">\r\n        \u003ckbd>Enter\u003c/kbd>\r\n      \u003c/div>\r\n    \u003c/div>\u003c/section>\r\n    \u003cdiv class=\"caixa-pagina\">\r\n      \u003csection class=\"bloco\" id=\"sec-abertos\" hidden>\u003ch2>Abertos agora\u003c/h2>\u003cdiv class=\"abertos\" id=\"abertos\">\u003c/div>\u003c/section>\r\n      \u003csection class=\"bloco\" id=\"sec-destaques\" hidden>\u003ch2>Mais usados por você\u003c/h2>\u003cdiv class=\"destaques\" id=\"destaques\">\u003c/div>\u003c/section>\r\n      \u003csection class=\"bloco\" style=\"padding-bottom:56px\">\r\n        \u003cdiv class=\"todos-topo\">\u003ch2 id=\"todos-titulo\">\u003c/h2>\u003cdiv class=\"guias\" id=\"guias-grupo\" role=\"tablist\" aria-label=\"Grupo\">\u003c/div>\u003c/div>\r\n        \u003cdiv class=\"lista-sites\" id=\"lista-sites\">\u003c/div>\r\n        \u003cp class=\"vazio\" id=\"nada\" hidden>\u003c/p>\r\n      \u003c/section>\r\n    \u003c/div>\r\n  \u003c/main>\r\n\r\n  \u003cfooter class=\"rodape\" id=\"rodape\">\u003cdiv class=\"caixa-pagina\">\r\n    \u003cbutton type=\"button\" class=\"btn verde\" id=\"at-chamar\">\u003cspan data-ic=\"headset\">\u003c/span>Chamar o TI\u003c/button>\r\n    \u003cspan>O uso deste computador é registrado pela Pontual.\u003c/span>\r\n    \u003cbutton type=\"button\" class=\"elo\" id=\"at-ver-aviso\">Ver o que é registrado\u003c/button>\r\n    \u003cspan class=\"fim num\" id=\"at-config\">\u003c/span>\r\n  \u003c/div>\u003c/footer>\r\n\r\n  \u003cdiv class=\"manut\" id=\"at-manut\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"at-manut-titulo\" aria-describedby=\"at-manut-texto\" tabindex=\"-1\" hidden>\r\n    \u003cdiv>\u003ci data-ic=\"wrench\" data-tam=\"44\">\u003c/i>\u003ch2 id=\"at-manut-titulo\">Computador em manutenção\u003c/h2>\u003cp id=\"at-manut-texto\">\u003c/p>\u003c/div>\r\n  \u003c/div>\r\n  \u003cdiv class=\"veu\" id=\"at-veu\" hidden>\u003cdiv class=\"folha\" id=\"at-folha\" role=\"dialog\" aria-modal=\"true\">\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"avisos\" id=\"avisos\" aria-live=\"polite\">\u003c/div>\r\n\r\n\u003cscript>// Tela da atendente do Terminal Pontual (docs/V1-CONTRATO.md, seções 5 e 6).\r\n// Funciona em dois ambientes:\r\n//  - dentro do programa Terminal, que injeta window.PONTUAL = { token, hostname, hosted: true },\r\n//    abre os sites e envia heartbeat e eventos;\r\n//  - dentro do programa Terminal em modo local (sem servidor), que injeta\r\n//    window.PONTUAL = { hosted: true, local: true, hostname, config }: a página não chama nenhuma API;\r\n//  - num navegador comum, com ?token= na URL: a própria página simula tudo isso, para teste.\r\n// Regra da casa: nenhum dado vindo do servidor entra na página por innerHTML, só por textContent.\r\n(() => {\r\n  'use strict';\r\n\r\n  // ================================================================= ícones\r\n  // Desenhos fixos, escritos aqui mesmo. É o único uso de innerHTML do arquivo.\r\n  const IC = {\r\n    search: '\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"m20 20-3.5-3.5\"/>', x: '\u003cpath d=\"M6 6l12 12M18 6 6 18\"/>',\r\n    check: '\u003cpath d=\"m5 12 5 5 9-10\"/>', arrow: '\u003cpath d=\"M5 12h14M13 6l6 6-6 6\"/>',\r\n    alert: '\u003cpath d=\"M12 4 3 20h18L12 4Z\"/>\u003cpath d=\"M12 10v4M12 17h.01\"/>',\r\n    headset: '\u003cpath d=\"M4 14v-2a8 8 0 0 1 16 0v2\"/>\u003crect x=\"3\" y=\"13\" width=\"4\" height=\"6\" rx=\"1.5\"/>\u003crect x=\"17\" y=\"13\" width=\"4\" height=\"6\" rx=\"1.5\"/>\u003cpath d=\"M19 19c0 1.5-2 2-5 2\"/>',\r\n    wrench: '\u003cpath d=\"M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17l3 3 5.2-5.2a4 4 0 0 0 5.3-5.3l-2.6 2.6-2-2 2.6-2.6Z\"/>',\r\n    ban: '\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m6 6 12 12\"/>', clock: '\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>',\r\n    pdf: '\u003cpath d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z\"/>\u003cpath d=\"M14 3v5h5M9 13h6M9 17h4\"/>',\r\n    calc: '\u003crect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\"/>\u003cpath d=\"M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01\"/>',\r\n    grid: '\u003crect x=\"4\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"13\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"4\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"13\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\"/>',\r\n    lock: '\u003crect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"/>\u003cpath d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>',\r\n    power: '\u003cpath d=\"M12 4v8\"/>\u003cpath d=\"M7 7a7 7 0 1 0 10 0\"/>', folder: '\u003cpath d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z\"/>', load: '\u003cpath d=\"M12 3a9 9 0 1 0 9 9\"/>',\r\n  };\r\n  function ic(nome, tam = 18) {\r\n    const s = document.createElement('span');\r\n    s.innerHTML = `\u003csvg width=\"${Number(tam)}\" height=\"${Number(tam)}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${IC[nome]}\u003c/svg>`;\r\n    return s.firstChild;\r\n  }\r\n  // Marcadores data-ic viram ícones: dentro do elemento, se for \u003ci>; no lugar dele, se for \u003cspan>.\r\n  for (const alvo of document.querySelectorAll('[data-ic]')) {\r\n    const icone = ic(alvo.dataset.ic, Number(alvo.dataset.tam) || 18);\r\n    if (alvo.tagName === 'I') alvo.replaceChildren(icone); else alvo.replaceWith(icone);\r\n  }\r\n\r\n  // ============================================================== utilidades\r\n  const CORES = ['#0d47a1', '#1976d2', '#2e9e5b', '#0f9d76', '#0c8fd0', '#2e416d', '#4f6fcf', '#0f766e'];\r\n  const GRUPOS = ['Bancos e promotoras', 'Comunicação', 'Pontual e ferramentas'];\r\n  const $ = (id) => document.getElementById(id);\r\n  const el = (tag, props = {}, ...filhos) => { const n = Object.assign(document.createElement(tag), props); n.append(...filhos.filter((f) => f !== null && f !== undefined)); return n; };\r\n  const hhmm = (d = new Date()) => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });\r\n  const cor = (nome) => { let h = 0; for (const c of nome) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CORES[h % CORES.length]; };\r\n  const iniciais = (nome) => {\r\n    const p = nome.trim().split(/\\s+/).filter(Boolean);\r\n    if (!p.length) return '?';\r\n    return ((p[0][0] || '') + (p[1] ? p[1][0] : p[0][1] || '')).toUpperCase();\r\n  };\r\n  const avatar = (nome, classe = '') => {\r\n    const a = el('span', { className: `avatar ${classe}`, textContent: iniciais(nome) });\r\n    a.style.background = cor(nome);\r\n    a.setAttribute('aria-hidden', 'true');\r\n    return a;\r\n  };\r\n  // Logos dos sites (pelo domínio) e programas (pelo nome do .exe): logos/mapa.json. Sem logo, ficam as iniciais.\r\n  let LOGOS = { hosts: {}, exes: {} };\r\n  fetch('logos/mapa.json').then((r) => (r.ok ? r.json() : null)).then((m) => { if (m) { LOGOS = m; if (!modoCalc) desenhar(); } }).catch(() => {});\r\n  const logoDoExe = (caminho) => LOGOS.exes[String(caminho || '').split(/[\\\\/]/).pop().toLowerCase()];\r\n  const logoDe = (i) => {\r\n    if (!i) return undefined;\r\n    if (i.kind === 'program') return logoDoExe(i.target);\r\n    let h = '';\r\n    try { h = new URL(i.target).hostname; } catch { return undefined; }\r\n    for (; h; h = h.includes('.') ? h.slice(h.indexOf('.') + 1) : '') if (LOGOS.hosts[h]) return LOGOS.hosts[h];\r\n    return undefined;\r\n  };\r\n  const marca = (nome, logo, classe) => {\r\n    const a = avatar(nome, classe);\r\n    if (!logo) return a;\r\n    const img = el('img', { alt: '', src: window.__LOGOS[logo] });\r\n    img.onerror = () => a.replaceWith(avatar(nome, classe));\r\n    a.classList.add('logo-marca'); a.style.background = ''; a.replaceChildren(img);\r\n    return a;\r\n  };\r\n  const primeiro = (nome) => nome.trim().split(/\\s+/)[0] || '';\r\n  const saudar = () => { const h = new Date().getHours(); return h \u003c 12 ? 'Bom dia' : h \u003c 18 ? 'Boa tarde' : 'Boa noite'; };\r\n  const texto = (v, max = 300) => (typeof v === 'string' ? v.slice(0, max) : '');\r\n  const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();\r\n\r\n  // ================================================================ ambiente\r\n  const parametros = new URLSearchParams(location.search);\r\n  const injetado = window.PONTUAL && typeof window.PONTUAL === 'object' ? window.PONTUAL : null;\r\n  const P = injetado && injetado.hosted === true\r\n    ? { token: texto(injetado.token, 500), hostname: texto(injetado.hostname, 100), hosted: true, local: injetado.local === true, locked: injetado.locked === true, apps: injetado.apps === true, calc: injetado.calc === true, pdf: injetado.pdf === true }\r\n    : { token: parametros.get('token') || '', hostname: parametros.get('hostname') || 'Navegador', hosted: false, local: false };\r\n  // Modo janela da calculadora: o Terminal (2.11+) abre esta mesma página numa janela própria do Windows com ?calc=1.\r\n  const modoCalc = window.__CALC === true;\r\n  const ponte = P.hosted && window.chrome && window.chrome.webview ? window.chrome.webview : null;\r\n  const aoPrograma = (mensagem) => { if (ponte) ponte.postMessage(mensagem); };\r\n\r\n  const INTERVALO_SINAL = 15000;   // heartbeat, quando a página não está hospedada\r\n  const INTERVALO_NOVA_TENTATIVA = 5000;\r\n  const CHAVE_USO = 'pontual.terminal.uso';\r\n  const INICIO_SESSAO = new Date().toISOString();\r\n\r\n  // ================================================================== estado\r\n  const S = {\r\n    config: null,            // última configuração conhecida: { version, attendantName, observationMode, items }\r\n    invalido: false,         // 401: token ausente, inválido ou máquina removida\r\n    estado: null,            // estado informado pelo servidor: 'pending', 'active' ou 'maintenance'\r\n    manut: null,             // { reason, until }\r\n    online: null,            // null enquanto não se sabe\r\n    nome: '',                // nome da atendente\r\n    abertos: [],             // [{ id, name }]\r\n    cat: 'Todos',\r\n    avisoAberto: false,\r\n    apps: null,              // aplicativos do computador, informados pelo programa: [{ id, name, exe, source, status, open }]\r\n    appsAberto: false,\r\n    appsBusca: '',\r\n    calcAberto: false,\r\n    calc: { expr: '', ultima: '' }, // calculadora própria do Terminal\r\n    uso: lerUso(),\r\n  };\r\n\r\n  function lerUso() {\r\n    try {\r\n      const bruto = JSON.parse(localStorage.getItem(CHAVE_USO) || '{}');\r\n      const uso = {};\r\n      if (bruto && typeof bruto === 'object') for (const [id, n] of Object.entries(bruto)) if (Number.isFinite(n) && n > 0) uso[id] = n;\r\n      return uso;\r\n    } catch { return {}; }\r\n  }\r\n  function contarUso(id) {\r\n    S.uso[id] = (S.uso[id] || 0) + 1;\r\n    try { localStorage.setItem(CHAVE_USO, JSON.stringify(S.uso)); } catch { /* sem armazenamento: a contagem vale só nesta sessão */ }\r\n  }\r\n\r\n  // ===================================================================== API\r\n  class ErroHttp extends Error { constructor(status) { super(`HTTP ${status}`); this.status = status; } }\r\n  async function api(metodo, caminho, corpo) {\r\n    const r = await fetch(`/api/v1${caminho}`, {\r\n      method: metodo, cache: 'no-store', credentials: 'omit',\r\n      headers: { Authorization: `Bearer ${P.token}`, ...(corpo ? { 'Content-Type': 'application/json' } : {}) },\r\n      body: corpo ? JSON.stringify(corpo) : undefined,\r\n      signal: AbortSignal.timeout(10000),\r\n    });\r\n    if (!r.ok) throw new ErroHttp(r.status);\r\n    return r.status === 204 ? null : r.json();\r\n  }\r\n  // Falha de rede (servidor fora do ar, cabo solto) é diferente de resposta de erro do servidor.\r\n  const falhaDeRede = (e) => !(e instanceof ErroHttp);\r\n\r\n  function lerConfig(c) {\r\n    const itens = Array.isArray(c && c.items) ? c.items : [];\r\n    return {\r\n      version: Number.isFinite(c && c.version) ? c.version : 0,\r\n      attendantName: texto(c && c.attendantName, 120),\r\n      observationMode: Boolean(c && c.observationMode),\r\n      items: itens.filter((i) => i && typeof i.id === 'string' && typeof i.name === 'string').map((i) => ({\r\n        id: i.id, name: texto(i.name, 120), kind: i.kind === 'program' ? 'program' : 'site', target: texto(i.target, 2000),\r\n        group: texto(i.group, 80) || GRUPOS[2], hosts: Array.isArray(i.hosts) ? i.hosts.filter((h) => typeof h === 'string') : [],\r\n      })),\r\n    };\r\n  }\r\n\r\n  let buscandoConfig = false, tentarDeNovo = 0;\r\n  async function carregarConfig() {\r\n    if (P.local || buscandoConfig || S.invalido) return;\r\n    buscandoConfig = true;\r\n    clearTimeout(tentarDeNovo);\r\n    try {\r\n      S.config = lerConfig(await api('GET', '/device/config'));\r\n      S.online = true;\r\n      if (S.config.attendantName) S.nome = S.config.attendantName;\r\n      if (!S.estado) S.estado = 'active';\r\n    } catch (e) {\r\n      if (e.status === 401) S.invalido = true;\r\n      else {\r\n        if (falhaDeRede(e)) S.online = false;\r\n        // Máquina ainda pendente pode receber erro aqui; o estado vem pelo heartbeat. Tenta de novo logo.\r\n        if (S.estado !== 'pending') tentarDeNovo = setTimeout(carregarConfig, INTERVALO_NOVA_TENTATIVA);\r\n      }\r\n    } finally {\r\n      buscandoConfig = false;\r\n      desenhar();\r\n    }\r\n  }\r\n\r\n  function aplicarEstado(r) {\r\n    const antes = S.estado;\r\n    if (r.state === 'pending' || r.state === 'active' || r.state === 'maintenance') S.estado = r.state;\r\n    if (typeof r.attendantName === 'string' && r.attendantName) S.nome = texto(r.attendantName, 120);\r\n    S.manut = r.maintenan if (ok) ok.focus(); }\r\n  });\r\n\r\n  for (const alvo of document.querySelectorAll('[data-logo]')) {\r\n    const img = el('img', { src: 'https://www.pontualconsig.com.br/frontend/assets/img/LOGO%20PONTUAL%20CONSIG%203.svg', alt: 'Pontual Consig' });\r\n    // Sem internet, a logo é trocada pelo nome escrito.\r\n    img.onerror = () => alvo.replaceChildren(el('span', { className: 'logo-texto' }, 'Pontual', el('em', { textContent: 'Consig' })));\r\n    alvo.append(img);\r\n  }\r\n\r\n  // Mensagens do programa: \"state\" (abas abertas) é do contrato; \"config\" avisa que a configuração mudou;\r\n  // \"status\" traz o estado da máquina, que só o programa conhece, porque é ele quem envia o heartbeat.\r\n  if (ponte) {\r\n    ponte.addEventListener('message', (e) => {\r\n      const m = e.data;\r\n      if (!m || typeof m !== 'object') return;\r\n      if (m.type === 'state' && Array.isArray(m.open)) {\r\n        S.abertos = m.open.filter((a) => a && typeof a.id === 'string' && typeof a.name === 'string').map((a) => ({ id: a.id, name: texto(a.name, 120) }));\r\n        desenhar();\r\n      } else if (m.type === 'config') {\r\n        // No modo local a configuração vem na própria mensagem (o arquivo foi editado).\r\n        if (P.local) { if (m.config) usarConfigLocal(m.config); desenhar(); } else carregarConfig();\r\n      } else if (m.type === 'apps' && Array.isArray(m.apps)) {\r\n        S.apps = m.apps.filter((a) => a && typeof a.id === 'string' && typeof a.name === 'string').slice(0, 500).map((a) => ({\r\n          id: a.id, name: texto(a.name, 120), exe: texto(a.exe, 120).toLowerCase(),\r\n          source: ['windows', 'store', 'installed', 'downloaded'].includes(a.source) ? a.source : 'installed',\r\n          status: ['blocked', 'allowed', 'request'].includes(a.status) ? a.status : 'request', open: a.open === true,\r\n        }));\r\n        desenhar();\r\n      } else if (m.type === 'status') {\r\n        const voltou = S.online === false && m.online === true;\r\n        if (typeof m.online === 'boolean') S.online = m.online;\r\n        aplicarEstado(m);\r\n        if (S.estado !== 'pending' && (!S.config || voltou)) carregarConfig();\r\n        desenhar();\r\n      }\r\n    });\r\n  }\r\n\r\n  function usarConfigLocal(c) {\r\n    if (!c || typeof c !== 'object') return;\r\n    S.config = lerConfig(c);\r\n    S.nome = S.config.attendantName;\r\n    S.estado = 'active';\r\n  }\r\n\r\n  // ================================================================== início\r\n  if (P.local) usarConfigLocal(injetado.config);\r\n  relogio();\r\n  setInterval(() => { relogio(); desenharSaudacao(); }, 20000);\r\n  desenhar();\r\n  if (P.hosted) {\r\n    aoPrograma({ type: 'ready' });   // o programa responde com \"state\" e \"status\"\r\n    if (!P.local) carregarConfig();\r\n  } else if (!P.token) {\r\n    S.invalido = true;\r\n    desenhar();\r\n  } else {\r\n    evento('session_started');\r\n    sinal();\r\n    setInterval(sinal, INTERVALO_SINAL);\r\n    setInterval(vigiarJanelas, 1500);\r\n  }\r\n})();\r\n\u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n","assistente":"\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"referrer\" content=\"no-referrer\">\n\u003ctitle>Assistente Pontual\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>/* Tela da atendente do Terminal Pontual.\r\n   Cores, fonte, logo e componentes vêm do protótipo aprovado (prototipos/index.html). */\r\n:root {\r\n  --azul-900: #0a2f6b; --azul-700: #0d47a1; --azul-500: #1976d2; --azul-100: #e3effc; --azul-50: #f3f8fe;\r\n  --verde-700: #1f7a45; --verde-500: #2e9e5b; --verde-400: #10
