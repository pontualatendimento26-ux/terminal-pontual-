<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05070d;height:100%}canvas{width:1400px;height:900px;display:block}</style></head><body>
<canvas id="c"></canvas><script src="mapa.js"></script><script>
// Estrutura igual à da base real (só as quantidades; nomes inventados).
const nomes=['Definir: cliente pode receber o valor','Prazos observados, horário-limite do banco','Checklist antes de digitar e enviar','Cliente ansioso ou irritado, como agir','Nunca pedir nem usar a senha do cliente'];
const nos=[{id:'ia',tipo:'nucleo',rotulo:'IA Pontual'}];
const add=(id,pai,tipo,rotulo,extra={})=>nos.push({id,pai,tipo,rotulo,estado:'active',...extra});
const ramo=(t,rot,grupos)=>{add('r:'+t,'ia','ramo',rot,{ramo:t});grupos.forEach(([g,n],gi)=>{const gid=g?('g:'+t+gi):'r:'+t;if(g)add(gid,'r:'+t,'grupo',g,{ramo:t});for(let i=0;i<n;i++)add(t+gi+'_'+i,gid,t==='attendant'?'attendant':t,nomes[i%5]+' '+i,{ramo:t});});};
ramo('script','Roteiros',[[null,10]]);
ramo('document','Documentos',[[null,1]]);
ramo('knowledge','Conhecimentos operacionais',[['Sem banco definido',24],['BRB',1],['Banco Inter',5],['Banco Inter - INSS',1],['Cartão consignado',1],['Facta',1],['Geral',13],['Nexus - consultas',1],['PAN - INSS',1],['Paraná Banco',3],['Planilhas de senhas',1]]);
ramo('system','Sistemas da Pontual',[['Sistema CRM',6],['Nexus',9]]);
ramo('attendant','Atendentes',[['Atendentes PC',10],['Atendentes celular',5]]);
ramo('suggestion','Aprendizado',[['Lacuna de conhecimento',11],['Informação nova',3],['Revisão',7]]);
add('r:manual','ia','ramo','Manual de comunicação',{ramo:'manual'});add('m:manual','r:manual','manual','Comportamento',{ramo:'manual'});
add('r:siape','ia','ramo','Margem liberada',{ramo:'siape',n:43});add('z:base','r:siape','siape','Base de margens do SIAPE (SQL)',{ramo:'siape'});
ramoSiape();
function ramoSiape(){const gs=[['g:siape:pending','Esperando aprovação',12,'pending'],['g:siape:sent','Enviadas este mês',30,'active']];for(const [g,rot,n,est] of gs){add(g,'r:siape','grupo',rot,{ramo:'siape',n});for(let i=0;i<n;i++)add('z:'+g+i,g,'siape','Servidor '+i,{ramo:'siape',estado:est});}}
const m=new MapaNeural(document.getElementById('c'));m.setDados({nos});
const modo=location.hash.slice(1);
if(modo==='aberto') m.expandirTudo(); else if(modo==='sem') { m.alternar('g:knowledge0'); }
m.ajustar(true);
setTimeout(()=>{for(const n of m.visiveis){n.x=n.tx;n.y=n.ty;}},50);
</script></body></html>
